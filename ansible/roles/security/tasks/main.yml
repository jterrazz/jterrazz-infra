---
# Security Hardening Role
# Configures SSH, the firewall, unattended upgrades and kernel hardening.
#
# Deliberately NOT here: fail2ban and auditd.
#   - fail2ban guarded a public SSH port that does not exist. The host has no
#     public inbound path at all — public traffic arrives through cloudflared's
#     OUTBOUND tunnel, and SSH is reachable only from the tailnet. Banning
#     tailnet IPs after a typo was the only thing it could ever have done.
#   - auditd needs CAP_AUDIT_*, which the OrbStack hypervisor withholds, so it
#     was already skipped on the active target and its rules never loaded.
# Removing them also removes their memory footprint from a 4-8Gi node.

- name: Install security packages
  ansible.builtin.apt:
    name:
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [security, packages]

# SSH Hardening
#
# Configuration goes in a DROP-IN, not by replacing /etc/ssh/sshd_config
# wholesale. Debian ships `Include /etc/ssh/sshd_config.d/*.conf` at the top of
# the stock file precisely so packages and config management can layer on top
# without owning the distro file (and without losing whatever the distro adds
# in the next release).
#
# The Include must stay at the TOP: in sshd_config the FIRST occurrence of a
# keyword wins, so an Include placed at the bottom would let the stock file's
# own defaults beat every value we set. This task is a no-op on a stock Debian
# 13 file and self-heals a file where the line was removed — without it a
# missing Include would make the whole drop-in silently inert.
- name: Ensure sshd_config includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [security, ssh]

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: [security, ssh]

# Two-stage validation, because a bad sshd config can lock us out of the box:
#   1. `validate: sshd -t -f %s` on the rendered drop-in — sshd parses the
#      candidate file BEFORE Ansible moves it into place, so a syntax error or
#      an unknown keyword never reaches /etc/ssh.
#   2. `sshd -t` afterwards on the EFFECTIVE config (stock file + every
#      drop-in). Stage 1 cannot see conflicts introduced by the combination,
#      and it is the combination that sshd will actually load on restart.
# If stage 2 fails we remove our drop-in — dropping back to the distro
# defaults is always reachable — and fail loudly rather than notifying a
# restart that would take sshd down.
- name: Harden sshd via drop-in
  tags: [security, ssh]
  block:
    - name: Configure SSH daemon hardening drop-in
      ansible.builtin.template:
        src: sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        mode: "0600"
        owner: root
        group: root
        backup: true
        validate: "sshd -t -f %s"
      notify: Restart SSH

    - name: Validate the effective sshd configuration
      ansible.builtin.command: sshd -t
      changed_when: false
  rescue:
    - name: Remove the rejected hardening drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/10-hardening.conf
        state: absent

    - name: Report the sshd validation failure
      ansible.builtin.fail:
        msg: >-
          sshd rejected the effective configuration after installing
          /etc/ssh/sshd_config.d/10-hardening.conf. The drop-in has been
          removed so sshd keeps running on the distro defaults. Run
          `sshd -t` on the host to see the parse error.

# CI deploy key — the `deploy-platform.yaml` workflow uses this to ssh
# in over Tailscale and run ansible-playbook. Idempotent (won't dupe
# the key on re-runs). Pubkey lives in defaults/main.yml; setting it
# empty in extra-vars skips the install.
- name: Install CI deploy public key in root's authorized_keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ security_ci_deploy_pubkey }}"
    state: present
    comment: "ci-deploy (jterrazz-infrastructure GHA)"
  when: security_ci_deploy_pubkey | length > 0
  tags: [security, ssh]

# UFW Firewall
# IPv6 is disabled in UFW — the cluster doesn't bind any IPv6 listeners
# and the extra rules would just be dead config.
- name: Disable IPv6 in UFW
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: "^IPV6="
    line: "IPV6=no"
  when: security_ufw_enabled
  tags: [security, firewall]

- name: Configure UFW default incoming policy # noqa: args[module]
  community.general.ufw:
    direction: incoming
    policy: "{{ security_ufw_default_incoming }}"
  when: security_ufw_enabled
  tags: [security, firewall]

- name: Configure UFW default outgoing policy # noqa: args[module]
  community.general.ufw:
    direction: outgoing
    policy: "{{ security_ufw_default_outgoing }}"
  when: security_ufw_enabled
  tags: [security, firewall]

- name: Configure UFW default forward policy # noqa: args[module]
  community.general.ufw:
    direction: routed
    policy: "{{ security_ufw_default_forward }}"
  when: security_ufw_enabled
  tags: [security, firewall]

- name: Configure UFW rules
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('') }}"
    from_ip: "{{ item.from | default('any') }}"
  loop: "{{ security_ufw_rules }}"
  when: security_ufw_enabled
  tags: [security, firewall]

# SSH access - public or Tailscale-only based on configuration
- name: Configure SSH access (public)
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('') }}"
    from_ip: "{{ item.from | default('any') }}"
  loop: "{{ security_ufw_ssh_rules_public }}"
  when:
    - security_ufw_enabled
    - not security_ssh_tailscale_only
  tags: [security, firewall]

- name: Configure SSH access (Tailscale only)
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('') }}"
    from_ip: "{{ item.from | default('any') }}"
  loop: "{{ security_ufw_ssh_rules_tailscale }}"
  when:
    - security_ufw_enabled
    - security_ssh_tailscale_only
  tags: [security, firewall]

- name: Remove public SSH rule when Tailscale-only mode
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    delete: true
  when:
    - security_ufw_enabled
    - security_ssh_tailscale_only
  failed_when: false
  tags: [security, firewall]

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: security_ufw_enabled
  tags: [security, firewall]

# Automatic Updates
- name: Configure automatic updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  when: security_auto_updates_enabled
  tags: [security, updates]

- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
  when: security_auto_updates_enabled
  tags: [security, updates]

# Kernel Hardening
- name: Configure kernel security parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ security_kernel_params }}"
  tags: [security, sysctl]

# System Hardening
- name: Disable uncommon network protocols
  ansible.builtin.blockinfile:
    path: /etc/modprobe.d/blacklist-protocols.conf
    create: true
    mode: "0644"
    block: |
      install dccp /bin/true
      install sctp /bin/true
      install rds /bin/true
      install tipc /bin/true
  when: security_disable_uncommon_protocols
  tags: [security]
