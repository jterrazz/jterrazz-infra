---
# The OrbStack image ships systemd-resolved MASKED (the base role installs it).
# Without a stub resolver Tailscale writes /etc/resolv.conf itself with
# `nameserver 100.100.100.100`, which does not chase CNAMEs from a public zone
# into the tailnet zone — the deploy then fails at
# "helm registry login registry.internal.jterrazz.com".
- name: Ensure systemd-resolved is enabled (needed for CNAME chasing into tailnet)
  ansible.builtin.systemd_service:
    name: systemd-resolved
    masked: false
    enabled: true
    state: started
    daemon_reload: true
  tags: [tailscale, dns]

# OrbStack's DHCP hands out a bogus DNS server (0.250.250.200) that silently
# drops queries. Without an override resolved tries it first and CoreDNS
# upstream forwarding times out for every non-tailnet name.
- name: Ensure the systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  tags: [tailscale, dns]

- name: Configure the systemd-resolved global DNS overrides
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/upstream.conf
    mode: "0644"
    content: |
      [Resolve]
      DNS=1.1.1.1 9.9.9.9
      FallbackDNS=1.0.0.1 8.8.8.8
      # Both default to yes and both open a listener on 5355 (LLMNR) and
      # 5353 (mDNS) bound to every interface, answerable by any peer on the
      # OrbStack bridge. Nothing here resolves by either protocol: names are
      # tailnet MagicDNS, cluster DNS or public.
      LLMNR=no
      MulticastDNS=no
  notify: Restart systemd-resolved
  tags: [tailscale, dns]

# upstream.conf ABOVE IS NOT ENOUGH — this is the other half. `DNS=` in
# resolved.conf sets the GLOBAL resolver and does NOT remove the PER-LINK one
# DHCP supplies; resolved keeps both, and because eth0 has DefaultRoute it also
# writes the bogus server into /run/systemd/resolve/resolv.conf. That file is
# what kubelet pins with `--resolv-conf` (roles/k3s/templates/config.yaml.j2) and
# therefore what CoreDNS forwards to, so a third of every in-cluster upstream
# lookup was aimed at a resolver that silently drops queries.
#
# systemd-networkd is the DHCP client here, so its own knob is the fix:
# `UseDNS=false` in a `<name>.network.d/*.conf` drop-in, which overrides
# OrbStack's eth0.network without replacing a file the image owns. A
# dhclient.conf `supersede` or an ifupdown hook would be dead config.
- name: Discover the systemd-networkd file configuring the default interface
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      networkctl status {{ ansible_default_ipv4.interface }} --no-pager \
        | awk '/Network File:/ {print $3; exit}'
    executable: /bin/bash
  register: tailscale_networkd_file
  changed_when: false
  tags: [tailscale, dns]

# Fails loudly rather than writing a drop-in for a file that does not exist: a
# `.network.d` directory whose base file was renamed is inert, and an inert
# drop-in here means the bogus resolver comes back with nobody noticing.
- name: Assert the default interface is managed by systemd-networkd
  ansible.builtin.assert:
    that:
      - tailscale_networkd_file.stdout is match('.*\.network$')
    fail_msg: >-
      networkctl reports no .network file for
      {{ ansible_default_ipv4.interface }} (got
      {{ tailscale_networkd_file.stdout | default('') | trim | default('nothing', true) }}).
      This role disables the DHCP-supplied resolver through a systemd-networkd
      drop-in, which only works if networkd owns the link. If the OrbStack image
      switched network stacks, the fix has to switch with it — see the block
      comment above this task.
  tags: [tailscale, dns]

- name: Ensure the systemd-networkd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/network/{{ tailscale_networkd_file.stdout | trim | basename }}.d
    state: directory
    mode: "0755"
  tags: [tailscale, dns]

- name: Stop DHCP from installing its own resolver on the default link
  ansible.builtin.copy:
    dest: /etc/systemd/network/{{ tailscale_networkd_file.stdout | trim | basename }}.d/10-no-dhcp-dns.conf
    mode: "0644"
    content: |
      # Managed by ansible/roles/tailscale. OrbStack's DHCP hands out
      # 0.250.250.200, which silently drops every query; a global DNS= cannot
      # remove a per-link server. Only UseDNS is disabled — address, route
      # and search domain still come from DHCP.
      [DHCPv4]
      UseDNS=false

      [DHCPv6]
      UseDNS=false

      # RDNSS from router advertisements, the IPv6 equivalent of the same trap.
      [IPv6AcceptRA]
      UseDNS=false
  notify: Reload systemd-networkd
  tags: [tailscale, dns]

# The resolver must be live BEFORE the resolv.conf symlink and the tailscaled
# restart below, so this cannot wait for end-of-play handler execution.
- name: Apply the resolved and networkd config changes now
  ansible.builtin.meta: flush_handlers

- name: Point /etc/resolv.conf at the systemd-resolved stub
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  register: tailscale_resolv_conf_link
  tags: [tailscale, dns]

- name: Check if Tailscale is installed
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_binary
  tags: [tailscale]

# Only for an already-running tailscaled holding a stale resolv.conf: the
# fresh-install branch below starts the daemon after the symlink is in place.
- name: Restart tailscaled to pick up the systemd-resolved integration
  ansible.builtin.systemd_service:
    name: tailscaled
    state: restarted
  when:
    - tailscale_resolv_conf_link.changed
    - tailscale_binary.stat.exists
  tags: [tailscale]

- name: Install Tailscale
  when: not tailscale_binary.stat.exists
  tags: [tailscale]
  block:
    # deb822, NOT apt_key + apt_repository: Debian 13 removed the apt-key
    # binary so apt_key has nothing to call. Needs python3-debian on the
    # target, installed by the base role.
    - name: Add the Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: [deb]
        uris: https://pkgs.tailscale.com/stable/debian
        suites: [trixie]
        components: [main]
        signed_by: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
        state: present
        enabled: true

    # update_cache here, not as a separate step: the source was only just
    # written, so apt has no index for it and the install would fail with
    # "Unable to locate package tailscale".
    - name: Install the Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Enable the Tailscale service
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  tags: [tailscale]

# Boot-time self-heal: after a reboot tailscaled can come back "Logged out"
# (node-key expiry) and does NOT auto-reconnect. A logged-out node cannot
# resolve *.ts.net, so registry.internal.jterrazz.com NXDOMAINs, every app pod
# ImagePullBackOffs and Cloudflare 503s the public hostnames.
#
# The script is ALSO how this play logs in (last task in the block) — do not
# re-spell `tailscale up` as an argv here, or a flag added to one copy silently
# misses the other. It is idempotent: it exits 0 when BackendState is Running.
- name: Set up Tailscale login and boot-time auto-reauth
  when:
    - tailscale_oauth_client_id != ""
    - tailscale_oauth_client_secret != ""
  tags: [tailscale]
  block:
    - name: Create the Tailscale config directory
      ansible.builtin.file:
        path: /etc/tailscale
        state: directory
        mode: "0700"

    - name: Write the Tailscale auto-reauth credentials
      ansible.builtin.template:
        src: tailscale-autoauth.env.j2
        dest: /etc/tailscale/autoauth.env
        mode: "0600"
      no_log: true

    - name: Install the Tailscale auto-reauth script
      ansible.builtin.template:
        src: tailscale-autoauth.sh.j2
        dest: /usr/local/bin/tailscale-autoauth.sh
        mode: "0750"

    - name: Install the Tailscale auto-reauth systemd unit
      ansible.builtin.template:
        src: tailscale-autoauth.service.j2
        dest: /etc/systemd/system/tailscale-autoauth.service
        mode: "0644"

    - name: Enable the Tailscale auto-reauth service
      ansible.builtin.systemd_service:
        name: tailscale-autoauth.service
        enabled: true
        daemon_reload: true

    # The OAuth secret goes via the task environment, never a command line.
    - name: Connect to Tailscale
      ansible.builtin.command: /usr/local/bin/tailscale-autoauth.sh
      environment:
        TS_CLIENT_ID: "{{ tailscale_oauth_client_id }}"
        TS_CLIENT_SECRET: "{{ tailscale_oauth_client_secret }}"
      register: tailscale_up
      changed_when: "'re-authenticating' in tailscale_up.stdout"
      no_log: true

# Publishes tailscale_ip / tailscale_dns_hostname for the k3s role (TLS SANs,
# kubeconfig server URL) and the platform role (CoreDNS overrides, Helm values).
- name: Gather Tailscale facts for downstream plays
  ansible.builtin.include_tasks: facts.yml
  tags: [tailscale]
