---
# Storage Setup
# Prepares the hostPath root that every PV in this cluster is carved out of.
#
# Do not change any path in this file. /var/lib/k8s-data is baked into every
# PV manifest in kubernetes/ and holds live data.

# /var/lib/k8s-data is a symlink to a Mac folder mounted via OrbStack's
# auto file-share (/mnt/mac/...). hostPath PVs reference /var/lib/k8s-data
# directly, so the on-disk path stays stable, but the data lives on the
# Mac and survives `pulumi destroy` of the VM.
- name: Link /var/lib/k8s-data to the Mac bind dir on OrbStack
  when: deployment_target | default('hetzner') == 'orbstack'
  tags: [storage]
  block:
    - name: Resolve Mac bind dir
      ansible.builtin.set_fact:
        # OrbStack mounts the Mac user's home at /mnt/mac/Users/<user>.
        # The data folder is created by the Pulumi OrbStack provider before
        # the VM is started, so this path is always present here.
        storage_orbstack_data_dir: "/mnt/mac/Users/{{ lookup('env', 'USER') }}/.jterrazz-infrastructure/data"

    - name: Replace /var/lib/k8s-data with a symlink to the Mac dir
      ansible.builtin.file:
        src: "{{ storage_orbstack_data_dir }}"
        dest: /var/lib/k8s-data
        state: link
        force: true

# Base directory for all k8s storage. Skipped on OrbStack because the
# symlink above already makes /var/lib/k8s-data resolve to a real path.
- name: Create base storage directory
  when: deployment_target | default('hetzner') != 'orbstack'
  ansible.builtin.file:
    path: /var/lib/k8s-data
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: [storage]

# These two are NOT redundant, despite covering only 2 of the 8 apps.
#
# Auto-creation of a missing hostPath directory happens only when the PV sets
# `hostPath.type: DirectoryOrCreate` — kubelet performs no checks and creates
# nothing for the default (empty) type. The raw manifests under
# kubernetes/platform/ (librechat/uploads, openpanel/{postgres,redis,
# clickhouse}) all set DirectoryOrCreate and so genuinely need nothing here.
# Since platform chart 2.0 `hostPath.type: DirectoryOrCreate` is emitted
# unconditionally, so these mkdirs are now belt-and-braces rather than
# load-bearing — kept because they are cheap, keep first boot deterministic
# even if a chart regression drops the type, and predate the chart change.
#
# Mode 0755 — containers manage their own file ownership via securityContext.
# The paths are load-bearing: they must match the chart's
# /var/lib/k8s-data/<name> layout exactly.
- name: Create app storage directories for PVs without DirectoryOrCreate
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/k8s-data/n8n
    - /var/lib/k8s-data/portainer
  tags: [storage]
