---
# Values a human should not normally touch; the visible config surface is
# inventories/group_vars/all.yml. These three are read outside this role
# (playbooks/platform.yml post_tasks), hence the unprefixed names.

# Written by k3s on the node; every kubectl/helm task points KUBECONFIG here.
kubeconfig: /etc/rancher/k3s/k3s.yaml

# Staged by tasks/stage-manifests.yml, removed by platform.yml's post_tasks.
manifest_dir: /tmp/k8s-manifests

service_chart: "{{ manifest_dir }}/kubernetes/charts/service"
