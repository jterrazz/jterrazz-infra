---
# Platform role — defaults.
#
# Only values that should not normally be touched live here; the visible
# config surface (chart versions, private hostnames, ...) is
# inventories/group_vars/all.yml.

# k3s writes this on the node; every kubectl/helm task points KUBECONFIG at it.
kubeconfig: /etc/rancher/k3s/k3s.yaml

# Where the repo's kubernetes/ tree is staged on the node for the duration of
# the play (see tasks/stage-manifests.yml; removed again by platform.yml's
# post_tasks).
manifest_dir: /tmp/k8s-manifests

# The shared per-service chart: ingress + certificate + hostPath storage for a
# platform service, rendered from that service's service.yaml.
service_chart: "{{ manifest_dir }}/kubernetes/charts/service"
