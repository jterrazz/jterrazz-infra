---
# Service-chart resources FIRST: they create the `librechat-data` and
# `librechat-uploads` PVCs, and `helm install --wait` below blocks forever on a
# pod that cannot schedule for want of its claim.
- name: Deploy the LibreChat service-chart resources
  ansible.builtin.include_tasks: service-charts.yml
  vars:
    service_chart_releases:
      - { name: librechat, namespace: platform-ai }

# Before the app, so its `existingSecretName` resolves on first boot.
- name: Provision the LibreChat credentials
  ansible.builtin.include_tasks: infisical-secret.yml
  vars:
    secret_manifest: "{{ manifest_dir }}/kubernetes/services/librechat/secret.yaml"
    wait_secret_name: librechat-credentials-env
    wait_secret_namespace: platform-ai

- name: Deploy LibreChat MongoDB
  ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/kubernetes/services/librechat/mongodb.yaml
  register: librechat_mongo_apply
  changed_when: "'created' in librechat_mongo_apply.stdout or 'configured' in librechat_mongo_apply.stdout"

- name: Wait for LibreChat MongoDB to be ready
  ansible.builtin.command: kubectl rollout status deployment/librechat-mongodb -n platform-ai --timeout=120s
  changed_when: false

# NOTE the netpol letting LibreChat reach the gateway is NOT applied here: it
# is kubernetes/cluster/network-policies/prod-gateway-intelligence.yaml,
# applied by cluster-manifests.yml earlier in the play.
- name: Install LibreChat via Helm
  ansible.builtin.command: >
    helm upgrade --install librechat oci://ghcr.io/danny-avila/librechat-chart/librechat
    --namespace platform-ai
    --version {{ platform_chart_versions.librechat }}
    --values {{ manifest_dir }}/kubernetes/services/librechat/helm.yaml
    --wait
    --timeout 5m
  register: librechat_result
  changed_when: "'has been upgraded' in librechat_result.stdout or 'has been installed' in librechat_result.stdout"
