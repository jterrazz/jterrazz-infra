---
# The platform-telemetry namespace comes from
# kubernetes/cluster/namespaces.yaml via cluster-manifests.yml, never `kubectl
# create ns` here.

# Storage for all four stateful members first — each upstream `helm --wait`
# below blocks on a pod that cannot schedule without its PVC.
- name: Deploy the telemetry service-chart resources
  ansible.builtin.include_tasks: service-charts.yml
  vars:
    service_chart_releases:
      - { name: grafana, namespace: platform-telemetry }
      - { name: victoria-metrics, namespace: platform-telemetry }
      - { name: victoria-logs, namespace: platform-telemetry }
      - { name: victoria-traces, namespace: platform-telemetry }

- name: Install VictoriaMetrics via Helm
  ansible.builtin.command: >
    helm upgrade --install victoria-metrics vm/victoria-metrics-single
    --namespace platform-telemetry
    --version {{ platform_chart_versions.victoria_metrics }}
    --values {{ manifest_dir }}/kubernetes/services/victoria-metrics/helm.yaml
    --wait
    --timeout 5m
  register: victoria_metrics_result
  changed_when: "'has been upgraded' in victoria_metrics_result.stdout or 'has been installed' in victoria_metrics_result.stdout"

- name: Install VictoriaLogs via Helm
  ansible.builtin.command: >
    helm upgrade --install victoria-logs vm/victoria-logs-single
    --namespace platform-telemetry
    --version {{ platform_chart_versions.victoria_logs }}
    --values {{ manifest_dir }}/kubernetes/services/victoria-logs/helm.yaml
    --wait
    --timeout 5m
  register: victoria_logs_result
  changed_when: "'has been upgraded' in victoria_logs_result.stdout or 'has been installed' in victoria_logs_result.stdout"

- name: Install VictoriaTraces via Helm
  ansible.builtin.command: >
    helm upgrade --install victoria-traces vm/victoria-traces-single
    --namespace platform-telemetry
    --version {{ platform_chart_versions.victoria_traces }}
    --values {{ manifest_dir }}/kubernetes/services/victoria-traces/helm.yaml
    --wait
    --timeout 5m
  register: victoria_traces_result
  changed_when: "'has been upgraded' in victoria_traces_result.stdout or 'has been installed' in victoria_traces_result.stdout"

# kube-state-metrics and node-exporter used to be subcharts of the `prometheus`
# release. They are standalone releases now because the VictoriaMetrics chart
# bundles no equivalent — but both dashboards still depend on them, so they are
# not optional. Position in this file is arbitrary: VictoriaMetrics finds them
# by Service annotation whenever they appear, so there is no ordering
# constraint in either direction.
- name: Install kube-state-metrics via Helm
  ansible.builtin.command: >
    helm upgrade --install kube-state-metrics prometheus-community/kube-state-metrics
    --namespace platform-telemetry
    --version {{ platform_chart_versions.kube_state_metrics }}
    --values {{ manifest_dir }}/kubernetes/services/kube-state-metrics/helm.yaml
    --wait
    --timeout 5m
  register: ksm_result
  changed_when: "'has been upgraded' in ksm_result.stdout or 'has been installed' in ksm_result.stdout"

- name: Install node-exporter via Helm
  ansible.builtin.command: >
    helm upgrade --install node-exporter prometheus-community/prometheus-node-exporter
    --namespace platform-telemetry
    --version {{ platform_chart_versions.node_exporter }}
    --values {{ manifest_dir }}/kubernetes/services/node-exporter/helm.yaml
    --wait
    --timeout 5m
  register: node_exporter_result
  changed_when: "'has been upgraded' in node_exporter_result.stdout or 'has been installed' in node_exporter_result.stdout"

- name: Provision the OTel Collector credentials
  ansible.builtin.include_tasks: infisical-secret.yml
  vars:
    secret_manifest: "{{ manifest_dir }}/kubernetes/services/otel-collector/secret.yaml"
    wait_secret_name: otel-collector-secrets
    wait_secret_namespace: platform-telemetry

# After VictoriaLogs: the collector now owns pod-log shipping too (the filelog
# receiver that replaced the Alloy DaemonSet), so an earlier install has nowhere
# to write. It also exports to VictoriaMetrics and VictoriaTraces, both above.
- name: Install the OpenTelemetry Collector via Helm
  ansible.builtin.command: >
    helm upgrade --install otel-collector open-telemetry/opentelemetry-collector
    --namespace platform-telemetry
    --version {{ platform_chart_versions.otel_collector }}
    --values {{ manifest_dir }}/kubernetes/services/otel-collector/helm.yaml
    --wait
    --timeout 5m
  register: otel_result
  changed_when: "'has been upgraded' in otel_result.stdout or 'has been installed' in otel_result.stdout"

# argv form so the admin password is never assembled by a shell; no_log so it
# never reaches the Ansible output or a CI log.
- name: Install Grafana via Helm
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - grafana
      - grafana-community/grafana
      - --namespace
      - platform-telemetry
      - --version
      - "{{ platform_chart_versions.grafana }}"
      - --values
      - "{{ manifest_dir }}/kubernetes/services/grafana/helm.yaml"
      - --set
      - "adminPassword={{ grafana_admin_password }}"
      - --wait
      - --timeout
      - 5m
  register: grafana_result
  changed_when: "'has been upgraded' in grafana_result.stdout or 'has been installed' in grafana_result.stdout"
  no_log: true

- name: Deploy Grafana infrastructure dashboards
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      DASHBOARD_DIR="{{ manifest_dir }}/kubernetes/services/grafana/dashboards"
      for json_file in "$DASHBOARD_DIR"/*.json; do
        [ -f "$json_file" ] || continue
        name="dashboard-$(basename "$json_file" .json)"
        kubectl create configmap "$name" \
          --from-file="$(basename "$json_file")=$json_file" \
          --namespace platform-telemetry \
          --dry-run=client -o yaml | \
        kubectl label -f - --local --dry-run=client -o yaml \
          grafana_dashboard=1 | \
        kubectl annotate -f - --local --dry-run=client -o yaml \
          grafana_folder=infrastructure | \
        kubectl apply -f -
      done
    executable: /bin/bash
  changed_when: true

# APP alert rules are deliberately NOT applied here: they ship with the app
# that emits the metric, through the app chart's `spec.alerts` (which renders
# the same grafana_alert=1 ConfigMap the sidecar in grafana/helm.yaml watches).
# An alert living in this repo outlives the app it watches and goes stale
# invisibly. Only the infrastructure dashboards above, which describe the
# cluster itself, belong here.
