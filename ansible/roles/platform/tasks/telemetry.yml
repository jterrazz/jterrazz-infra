---
# ========================================
# Telemetry: Grafana + Loki + Tempo + Prometheus + OTel Collector + Alloy
# ========================================
# The platform-telemetry namespace is declared in
# kubernetes/cluster/namespaces.yaml and applied by cluster-base.yml — it is
# not created imperatively here.

# Storage first, for all four stateful members at once. Their PVs used to come
# from a hand-written telemetry-storage.yaml.j2 rendered by Ansible; they are
# now ordinary `storage:` entries in each service's service.yaml, so the
# service chart emits them (including the nodeAffinity that must reference the
# real node name) exactly like every other platform service.
- name: Deploy the telemetry service-chart resources
  ansible.builtin.include_tasks: service-charts.yml
  vars:
    service_chart_releases:
      - { name: grafana, namespace: platform-telemetry }
      - { name: prometheus, namespace: platform-telemetry }
      - { name: loki, namespace: platform-telemetry }
      - { name: tempo, namespace: platform-telemetry }

- name: Install Prometheus via Helm
  ansible.builtin.command: >
    helm upgrade --install prometheus prometheus-community/prometheus
    --namespace platform-telemetry
    --version {{ platform_chart_versions.prometheus }}
    --values {{ manifest_dir }}/kubernetes/services/prometheus/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: prometheus_result
  changed_when: "'has been upgraded' in prometheus_result.stdout or 'has been installed' in prometheus_result.stdout"

- name: Install Loki via Helm
  ansible.builtin.command: >
    helm upgrade --install loki grafana/loki
    --namespace platform-telemetry
    --version {{ platform_chart_versions.loki }}
    --values {{ manifest_dir }}/kubernetes/services/loki/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: loki_result
  changed_when: "'has been upgraded' in loki_result.stdout or 'has been installed' in loki_result.stdout"

# Alloy is the log SHIPPER for Loki (it tails container logs via
# loki.source.kubernetes and writes to loki.write) — Loki itself only stores
# what something else sends it, so this must come after the Loki install or
# the first scrape has nowhere to push. Values, including the write URL, are
# in kubernetes/services/alloy/helm.yaml.
- name: Install Grafana Alloy via Helm
  ansible.builtin.command: >
    helm upgrade --install alloy grafana/alloy
    --namespace platform-telemetry
    --version {{ platform_chart_versions.alloy }}
    --values {{ manifest_dir }}/kubernetes/services/alloy/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: alloy_result
  changed_when: "'has been upgraded' in alloy_result.stdout or 'has been installed' in alloy_result.stdout"

- name: Install Tempo via Helm
  ansible.builtin.command: >
    helm upgrade --install tempo grafana/tempo
    --namespace platform-telemetry
    --version {{ platform_chart_versions.tempo }}
    --values {{ manifest_dir }}/kubernetes/services/tempo/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: tempo_result
  changed_when: "'has been upgraded' in tempo_result.stdout or 'has been installed' in tempo_result.stdout"

- name: Apply the OTel Collector Infisical secret
  ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/kubernetes/services/otel-collector/secret.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: otel_secret_apply
  changed_when: "'created' in otel_secret_apply.stdout or 'configured' in otel_secret_apply.stdout"

- name: Wait for the OTel Collector credentials
  ansible.builtin.include_tasks: wait-for-secret.yml
  vars:
    wait_secret_name: otel-collector-credentials-env
    wait_secret_namespace: platform-telemetry

- name: Install the OpenTelemetry Collector via Helm
  ansible.builtin.command: >
    helm upgrade --install otel-collector open-telemetry/opentelemetry-collector
    --namespace platform-telemetry
    --version {{ platform_chart_versions.otel_collector }}
    --values {{ manifest_dir }}/kubernetes/services/otel-collector/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: otel_result
  changed_when: "'has been upgraded' in otel_result.stdout or 'has been installed' in otel_result.stdout"

# argv form so the admin password is never assembled by a shell, and no_log so
# it never reaches the Ansible output or a CI log.
- name: Install Grafana via Helm
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - grafana
      - grafana/grafana
      - --namespace
      - platform-telemetry
      - --version
      - "{{ platform_chart_versions.grafana }}"
      - --values
      - "{{ manifest_dir }}/kubernetes/services/grafana/helm.yaml"
      - --set
      - "adminPassword={{ grafana_admin_password }}"
      - --wait
      - --timeout
      - 5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: grafana_result
  changed_when: "'has been upgraded' in grafana_result.stdout or 'has been installed' in grafana_result.stdout"
  no_log: true

- name: Deploy Grafana infrastructure dashboards
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      DASHBOARD_DIR="{{ manifest_dir }}/kubernetes/services/grafana/dashboards"
      for json_file in "$DASHBOARD_DIR"/*.json; do
        [ -f "$json_file" ] || continue
        name="dashboard-$(basename "$json_file" .json)"
        kubectl create configmap "$name" \
          --from-file="$(basename "$json_file")=$json_file" \
          --namespace platform-telemetry \
          --dry-run=client -o yaml | \
        kubectl label -f - --local --dry-run=client -o yaml \
          grafana_dashboard=1 | \
        kubectl annotate -f - --local --dry-run=client -o yaml \
          grafana_folder=infrastructure | \
        kubectl apply -f -
      done
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: true

- name: Deploy Grafana alert rules
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - "{{ manifest_dir }}/kubernetes/services/grafana/alerts/signews-api-alerts.yaml"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: true
