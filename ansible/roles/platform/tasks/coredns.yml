---
# CoreDNS does not chase CNAMEs across upstream zones, so a pod resolving a
# private hostname stops at the CNAME into *.ts.net and gets NXDOMAIN — which
# is how containerd fails to pull from registry.jterrazz.com. This adds a
# `jterrazz.com` server block whose hosts plugin short-circuits the private
# names; everything else under the zone falls through to public DNS, so the
# cloudflared-fronted public apps still resolve normally.
#
# The lists are `private_hostnames` and `private_hostnames_via_traefik` in
# inventories/group_vars/all.yml, rendered by templates/coredns-custom.yaml.j2.

# Looked up at deploy time, not hardcoded: the ClusterIP is dynamic per
# cluster, so a fixed value silently breaks on the next repave.
- name: Get Traefik ClusterIP (in-cluster target for openpanel.jterrazz.com)
  ansible.builtin.command: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.clusterIP}'
  register: traefik_cluster_ip
  changed_when: false

- name: Apply CoreDNS custom config for private hostnames
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('ansible.builtin.template', 'coredns-custom.yaml.j2') | from_yaml }}"
  notify: Restart CoreDNS

# CoreDNS only reloads the custom ConfigMap on restart, and everything after
# this point (registry image pulls, `helm registry login`) needs the new
# records — an end-of-play handler would be far too late.
- name: Restart CoreDNS now if the config changed
  ansible.builtin.meta: flush_handlers
