---
# ========================================
# CoreDNS split-DNS for self-hosted hostnames
# ========================================
# Cluster pods that need to reach the self-hosted services (notably
# containerd pulling images from registry.jterrazz.com) hit a CNAME
# chain in public DNS that points into *.ts.net. CoreDNS does not
# chase CNAMEs across upstream zones, so without an override the
# response stops at the CNAME and the pull returns NXDOMAIN.
#
# We resolve this by adding a `jterrazz.com` server block via the
# k3s-supported `coredns-custom` ConfigMap. The hosts plugin maps
# the private hostnames to this cluster's own tailnet IP — so
# in-cluster lookups short-circuit through Traefik on the same node
# instead of round-tripping through the public CNAME chain. Anything
# else under jterrazz.com falls through to public DNS so the
# cloudflared-fronted public apps (sig.news, spwn.sh, etc.) still
# resolve normally.
#
# The hostname lists are `private_hostnames` and
# `private_hostnames_via_traefik` in inventories/group_vars/all.yml, rendered
# by templates/coredns-custom.yaml.j2.

# OpenPanel's dashboard does server-side rendering that fetches its OWN
# public URL (openpanel.jterrazz.com) from inside the pod (image 2.2 has no
# API_URL_SSR override yet). Resolving that to the node's tailnet IP would
# hairpin through the node ServiceLB and time out (same reason LibreChat
# talks to the gateway via its Service). So openpanel.jterrazz.com must
# resolve, IN-CLUSTER ONLY, to Traefik's ClusterIP — the browser keeps
# using public DNS → node tailnet IP. Look the ClusterIP up at deploy time
# so this survives cluster rebuilds (it is dynamic per cluster).
- name: Get Traefik ClusterIP (in-cluster target for openpanel.jterrazz.com)
  ansible.builtin.command: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.clusterIP}'
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: traefik_cluster_ip
  changed_when: false

- name: Apply CoreDNS custom config for private hostnames
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('ansible.builtin.template', 'coredns-custom.yaml.j2') | from_yaml }}"
  notify: Restart CoreDNS

# CoreDNS only reloads the custom ConfigMap on restart, and everything after
# this point — the registry image pulls, `helm registry login` — depends on
# the new records resolving. Flush now instead of letting the handler run at
# the end of the play, where it would be far too late to matter.
- name: Restart CoreDNS now if the config changed
  ansible.builtin.meta: flush_handlers
