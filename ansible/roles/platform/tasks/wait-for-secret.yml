---
# Block until the Infisical operator has materialized a Secret.
#
# Three services (otel-collector, librechat, openpanel) apply an
# InfisicalSecret and then have to wait for the operator to turn it into a
# real Secret before their workload can boot. That wait used to be copy-pasted
# verbatim three times; this is the one definition.
#
# Args:
#   wait_secret_name       — metadata.name of the Secret to wait for
#   wait_secret_namespace  — its namespace

- name: Wait for the Infisical operator to materialize {{ wait_secret_namespace ~ '/' ~ wait_secret_name }}
  ansible.builtin.command: kubectl get secret {{ wait_secret_name }} -n {{ wait_secret_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: wait_secret_result
  until: wait_secret_result.rc == 0
  retries: 30
  delay: 5
  changed_when: false
