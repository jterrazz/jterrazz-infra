---
# Apply an InfisicalSecret manifest, then block until the operator has
# materialized the real Secret behind it.
#
# The two halves are never useful apart: applying the InfisicalSecret only
# tells the operator what to fetch, and a workload scheduled before the Secret
# exists sits in CreateContainerConfigError rather than retrying gracefully.
# Four services need exactly this pair (cloudflared, librechat, openpanel,
# otel-collector), so it is one include rather than four apply+wait couples
# where one could quietly lose its wait.
#
# Args:
#   secret_manifest        — path of the InfisicalSecret manifest to apply
#                            (under {{ manifest_dir }})
#   wait_secret_name       — metadata.name of the Secret the operator creates
#   wait_secret_namespace  — its namespace
#
# KUBECONFIG comes from the role-level `environment:` in playbooks/platform.yml.

- name: Apply the InfisicalSecret for {{ wait_secret_namespace ~ '/' ~ wait_secret_name }}
  ansible.builtin.command: kubectl apply -f {{ secret_manifest }}
  register: infisical_secret_apply
  changed_when: "'created' in infisical_secret_apply.stdout or 'configured' in infisical_secret_apply.stdout"

- name: Wait for the Infisical operator to materialize {{ wait_secret_namespace ~ '/' ~ wait_secret_name }}
  ansible.builtin.command: kubectl get secret {{ wait_secret_name }} -n {{ wait_secret_namespace }}
  register: infisical_secret_wait
  until: infisical_secret_wait.rc == 0
  retries: 30
  delay: 5
  changed_when: false
