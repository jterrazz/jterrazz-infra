---
# Installs the `<name>-platform` release of kubernetes/charts/service — the
# Certificate + IngressRoute + hostPath PV/PVCs beside each upstream release.
#
# Callers MUST include this BEFORE the upstream chart: `helm install --wait`
# blocks on a pod that cannot schedule for want of a PVC that does not exist
# yet. (Only matters on a fresh cluster; once the PVs exist a re-run is fine.)
#
# Args:
#   service_chart_releases — [{name, namespace}, ...]; values come from
#                            kubernetes/services/<name>/platform.yaml

- name: Deploy the service-chart resources
  ansible.builtin.command: >
    helm upgrade --install {{ item.name }}-platform {{ service_chart }}
    --namespace {{ item.namespace }}
    --values {{ manifest_dir }}/kubernetes/services/{{ item.name }}/platform.yaml
    --set infrastructure.nodeName={{ inventory_hostname }}
    --wait
    --timeout 2m
  loop: "{{ service_chart_releases }}"
  loop_control:
    label: "{{ item.name }}-platform"
  register: service_chart_result
  changed_when: "'has been upgraded' in service_chart_result.stdout or 'has been installed' in service_chart_result.stdout"
