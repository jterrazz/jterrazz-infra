---
# Applied late on purpose: its IngressRoute needs cert-manager to have issued
# the TLS cert, and publish-app-chart.yml after it needs the registry up.
#
# Only the htpasswd Secret is generated here. It is a BOOTSTRAP secret — the
# Infisical operator cannot provide it, because on a fresh cluster the registry
# must be up before anything can pull the operator's own images — and it is a
# bcrypt hash, which never belongs in git.

- name: Install apache2-utils for htpasswd
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: true

# stdin (`-i`) with the value from the task environment, NEVER
# `htpasswd -nbB deploy <password>`: an argument is visible to any user on the
# box via `ps` for as long as the command runs.
- name: Generate the htpasswd hash for the registry
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf '%s' "$REGISTRY_PASSWORD" | htpasswd -niB deploy
    executable: /bin/bash
  environment:
    REGISTRY_PASSWORD: "{{ registry_password }}"
  register: htpasswd_result
  changed_when: false
  no_log: true

# The k8s module, NOT `kubectl create --from-literal` in a shell: a bcrypt hash
# is full of `$` and `/`, which a shell would expand or mangle.
- name: Create the registry htpasswd bootstrap secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: registry-auth
        namespace: platform-registry
      type: Opaque
      stringData:
        htpasswd: "{{ htpasswd_result.stdout | trim }}"
  no_log: true

- name: Deploy the registry service-chart resources
  ansible.builtin.include_tasks: service-charts.yml
  vars:
    service_chart_releases:
      - { name: registry, namespace: platform-registry }

# `grep -rl '^apiVersion:'`, not `kubectl apply -f <dir>`: the directory also
# holds service.yaml, a Helm VALUES file, and kubectl aborts the whole apply on
# it with "apiVersion not set". Same structural test
# .github/workflows/validate.yaml uses to pick manifests out of kubernetes/.
- name: Apply the registry manifests
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -rl '^apiVersion:' "{{ manifest_dir }}/kubernetes/services/registry" \
        | xargs --no-run-if-empty kubectl apply -f
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: registry_result
  changed_when: "'created' in registry_result.stdout or 'configured' in registry_result.stdout"

- name: Wait for the registry to be ready
  ansible.builtin.command: kubectl rollout status deployment/registry -n platform-registry --timeout=60s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

# publish-app-chart.yml's `helm registry login` talks HTTPS, and on a fresh
# cluster DNS-01 issuance lags the registry pod by a minute or two — without
# this the login fails with a TLS error.
- name: Wait for the registry TLS certificate to be issued
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready certificate/registry-tls
    -n platform-registry --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false
