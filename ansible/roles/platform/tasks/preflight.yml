---
# ========================================
# Pre-flight validation
# ========================================
#
# Every secret the platform play consumes is checked here, in one place,
# before anything is deployed. The list must cover ALL of them: a secret that
# is only checked at the point of use fails halfway through a deploy, and a
# secret with a fallback default (there used to be a literal
# `changeme-on-first-login` for the Grafana admin password) fails in the worst
# possible way — the deploy goes green and a public-ish service comes up with
# a known password.
#
# Both callers produce this exact set via scripts/lib/infisical-vars.py:
# scripts/deploy.sh and .github/workflows/deploy-platform.yaml.

- name: Validate required secrets
  ansible.builtin.assert:
    that:
      - cloudflare_api_token is defined and cloudflare_api_token | length > 0
      - cloudflare_tunnel_token is defined and cloudflare_tunnel_token | length > 0
      - infisical_client_id is defined and infisical_client_id | length > 0
      - infisical_client_secret is defined and infisical_client_secret | length > 0
      - registry_password is defined and registry_password | length > 0
      - grafana_admin_password is defined and grafana_admin_password | length > 0
    fail_msg: >
      Missing required secrets. Ensure cloudflare_api_token, cloudflare_tunnel_token,
      infisical_client_id, infisical_client_secret, registry_password and
      grafana_admin_password are passed as extra vars. They come from Infisical
      /jterrazz-infrastructure (plus the grafana/ subfolder) — see
      scripts/lib/infisical-vars.py.
    quiet: true
