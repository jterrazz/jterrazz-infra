---
# ========================================
# Cluster core: bootstrap secrets, TLS, secret sync, public ingress
# ========================================
# Order matters and is load-bearing:
#   1. bootstrap secrets — the Infisical operator itself needs credentials,
#      and cert-manager needs the Cloudflare token for DNS-01. Everything
#      else in the cluster is synced from Infisical by the operator.
#   2. cert-manager — issues the TLS certs every private IngressRoute needs.
#   3. the Infisical operator — provides the InfisicalSecret CRD.
#   4. cloudflared — depends on that CRD for its tunnel token.
#
# Each service uses helm.yaml for its upstream chart config and service.yaml
# for ingress/cert/storage via the shared service chart.

# The k8s module (not `kubectl create --dry-run | apply` in a shell) so the
# secret values are never assembled into a shell command line: a token
# containing `$`, a backtick or a newline would otherwise be mangled or
# expanded on its way through bash.
- name: Create the Cloudflare API token secret for networking
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token
        namespace: platform-networking
      type: Opaque
      stringData:
        api-token: "{{ cloudflare_api_token }}"
  no_log: true

- name: Create the Infisical credentials secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: infisical-credentials
        namespace: platform-secrets
      type: Opaque
      stringData:
        clientId: "{{ infisical_client_id }}"
        clientSecret: "{{ infisical_client_secret }}"
  no_log: true

- name: Install cert-manager via Helm
  ansible.builtin.command: >
    helm upgrade --install cert-manager jetstack/cert-manager
    --namespace platform-networking
    --version {{ platform_chart_versions.cert_manager }}
    --values {{ manifest_dir }}/kubernetes/services/cert-manager/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: certmanager_result
  changed_when: "'has been upgraded' in certmanager_result.stdout or 'has been installed' in certmanager_result.stdout"

- name: Wait for cert-manager webhook to be ready
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/cert-manager-webhook -n platform-networking --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

# No external-dns controller — Pulumi manages the Cloudflare DNS
# records for the cluster's private services (see pulumi/src/dns.ts).
# Public hostnames are auto-created by cloudflared when added to the
# tunnel's Public Hostnames in the Zero Trust dashboard.
- name: Apply cert-manager ClusterIssuers
  ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/kubernetes/services/cert-manager/issuers.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: issuers_result
  changed_when: "'created' in issuers_result.stdout or 'configured' in issuers_result.stdout"

- name: Install the Infisical secrets operator via Helm
  ansible.builtin.command: >
    helm upgrade --install infisical infisical/secrets-operator
    --namespace platform-secrets
    --version {{ platform_chart_versions.infisical }}
    --values {{ manifest_dir }}/kubernetes/services/infisical/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: infisical_helm_result
  changed_when: "'has been upgraded' in infisical_helm_result.stdout or 'has been installed' in infisical_helm_result.stdout"

# Cloudflared (Cloudflare Tunnel) — public traffic ingress without exposing
# port 443 on the host. Depends on the InfisicalSecret CRD installed just
# above, since the tunnel token is synced from Infisical at
# /jterrazz-infrastructure env=prod key=CLOUDFLARE_TUNNEL_TOKEN. See
# kubernetes/services/cloudflared/README.md for the one-time tunnel creation
# in the Cloudflare Zero Trust dashboard.
- name: Apply the cloudflared deployment
  ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/kubernetes/services/cloudflared/deployment.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: cloudflared_result
  changed_when: "'created' in cloudflared_result.stdout or 'configured' in cloudflared_result.stdout"
