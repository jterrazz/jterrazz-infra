---
# ========================================
# OpenPanel (self-hosted product analytics)
# ========================================
# Private dashboard on openpanel.jterrazz.com (Tailscale); public event
# ingest on analytics.jterrazz.com (/api/track only, via cloudflared).
# 6 workloads: Postgres + Redis + ClickHouse (stateful, hostPath PVCs) and
# op-api / op-worker / op-dashboard. op-api runs the DB migrations on boot.
# The platform-analytics namespace is declared in
# kubernetes/cluster/namespaces.yaml and applied by cluster-base.yml — it is
# not created imperatively here.
- name: Apply the OpenPanel shared config
  ansible.builtin.command: >
    kubectl apply
    -f {{ manifest_dir }}/kubernetes/services/openpanel/config.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: openpanel_base_apply
  changed_when: "'created' in openpanel_base_apply.stdout or 'configured' in openpanel_base_apply.stdout"

# Sync secrets from Infisical (/jterrazz-infrastructure/openpanel) before the
# DBs/apps so their envFrom + POSTGRES_PASSWORD resolve on first boot.
- name: Apply the OpenPanel Infisical secret
  ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/kubernetes/services/openpanel/secret.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: openpanel_secret_apply
  changed_when: "'created' in openpanel_secret_apply.stdout or 'configured' in openpanel_secret_apply.stdout"

- name: Wait for the OpenPanel secrets
  ansible.builtin.include_tasks: wait-for-secret.yml
  vars:
    wait_secret_name: openpanel-secrets
    wait_secret_namespace: platform-analytics

# The namespace's NetworkPolicies (default-deny + allows) live in
# kubernetes/cluster/network-policies/platform-analytics.yaml and are applied
# by cluster-base.yml earlier in the play — so the unauthenticated datastores
# are firewalled before they come up, with no task needed here.

# PV/PVCs come from the service chart (storage map in service.yaml), and must
# exist before the datastores reference the claims.
- name: Deploy the OpenPanel service-chart resources
  ansible.builtin.include_tasks: service-charts.yml
  vars:
    service_chart_releases:
      - { name: openpanel, namespace: platform-analytics }

- name: Deploy the OpenPanel datastores (Postgres, Redis, ClickHouse)
  ansible.builtin.command: >
    kubectl apply
    -f {{ manifest_dir }}/kubernetes/services/openpanel/postgres.yaml
    -f {{ manifest_dir }}/kubernetes/services/openpanel/redis.yaml
    -f {{ manifest_dir }}/kubernetes/services/openpanel/clickhouse.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: openpanel_db_apply
  changed_when: "'created' in openpanel_db_apply.stdout or 'configured' in openpanel_db_apply.stdout"

- name: Wait for the OpenPanel datastores to be ready
  ansible.builtin.command: kubectl rollout status deployment/{{ item }} -n platform-analytics --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  loop:
    - op-postgres
    - op-redis
    - op-clickhouse
  changed_when: false

# Apps + ingress. op-api migrates on boot, so give it a longer timeout.
- name: Deploy the OpenPanel apps and ingress
  ansible.builtin.command: >
    kubectl apply
    -f {{ manifest_dir }}/kubernetes/services/openpanel/apps.yaml
    -f {{ manifest_dir }}/kubernetes/services/openpanel/ingress.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: openpanel_apps_apply
  changed_when: "'created' in openpanel_apps_apply.stdout or 'configured' in openpanel_apps_apply.stdout"

- name: Wait for OpenPanel op-api to be ready (runs DB migrations on boot)
  ansible.builtin.command: kubectl rollout status deployment/op-api -n platform-analytics --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false
