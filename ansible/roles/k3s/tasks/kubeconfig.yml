---
# Fetch the node's kubeconfig to the repo root so kubectl/helm work from the
# machine that ran the playbook.

- name: Fetch the kubeconfig to the local machine
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../kubeconfig.yaml"
    flat: true

# Rewrite the loopback server URL to something reachable FROM THE LAPTOP.
#
# This must be the Tailscale MagicDNS name, not `ansible_host`: ansible_host is
# `orb`, an SSH-config alias that no resolver knows about, so the fetched
# kubeconfig pointed at https://orb:6443 and every kubectl call against it
# failed with a DNS error. The MagicDNS name works from any tailnet client and
# is in the API server's TLS SANs (see roles/k3s/templates/config.yaml.j2), so
# the certificate verifies too. Falls back to the tailnet IP, then to
# ansible_host, if Tailscale is not up.
# Match both loopback spellings: k3s writes 127.0.0.1 by default but
# 0.0.0.0 when the API server binds all interfaces (as ours does).
- name: Update the kubeconfig server address
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../kubeconfig.yaml"
    regexp: 'https://(127\.0\.0\.1|0\.0\.0\.0):6443'
    replace: "https://{{ tailscale_dns_hostname | default('') or tailscale_ip | default('') or ansible_host }}:6443"
  delegate_to: localhost
  become: false
