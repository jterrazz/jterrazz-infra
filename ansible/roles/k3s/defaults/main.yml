---
# k3s Role - Default Variables
#
# Config a human is expected to change (version, directories, node IP) lives
# in playbooks/group_vars/all.yml — that file is the visible config surface.
# Role defaults are only for values that should not normally be touched, and
# k3s_version is deliberately NOT duplicated here: two copies of a version
# pin is a silent-drift trap.
#
# Also deliberately absent, after grepping the repo for consumers:
#   - k3s_cluster_cidr / k3s_service_cidr — never rendered into the config
#     template, and their values (10.42.0.0/16, 10.43.0.0/16) are k3s's own
#     defaults, so dropping them changes nothing.
#   - k3s_tls_san / k3s_disable_components / k3s_extra_args — nothing in this
#     repo ever set them. The TLS SAN list is now built directly in
#     templates/config.yaml.j2 from the node + Tailscale facts.

# Token - generated once and stored in config file
# Leave empty for auto-generation on first install
k3s_token: ""

# Service
k3s_service_enabled: true
