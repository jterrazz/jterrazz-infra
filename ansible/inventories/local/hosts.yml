---
# Local inventory — OrbStack target.
#
# Targets the OrbStack-hosted Debian 13 (trixie) VM provisioned by `pulumi up
# --stack local`. The VM is non-isolated (OrbStack auto-mounts the Mac home at
# /mnt/mac/, which the storage role symlinks /var/lib/k8s-data into for
# persistence across `pulumi destroy`). The VM is reached through the
# OrbStack SSH proxy, not a direct port. The host key below matches the
# name the Pulumi dynamic provider emits.
#
# Invoked by `scripts/deploy.sh local`. For a one-shot Ansible run:
#   ansible-playbook -i ansible/inventories/local/hosts.yml \
#     ansible/playbooks/site.yml -e "@<extra-vars-file>"

# The group is named `cluster`, not `production`: this same group name is
# used by every inventory (local / ci / production) so group_vars and any
# `hosts:` selector stay portable. Naming it `production` here collided with
# the *environment* concept — the local inventory is not production.
all:
  children:
    cluster:
      hosts:
        jterrazz-infrastructure:
          # `orb` is the OrbStack SSH config's only Host entry; the VM is
          # selected via the user-style `root@<vm>@orb` ansible_user.
          #
          # NOTE: `orb` is an SSH-config alias, NOT a resolvable hostname.
          # Anything that needs a real address (kubeconfig server URL, k3s
          # TLS SANs) must use the node's Tailscale IP/FQDN instead — see
          # playbooks/kubernetes.yml.
          ansible_host: orb
          ansible_user: root@jterrazz-infrastructure
          ansible_ssh_common_args: "-F {{ lookup('env', 'HOME') }}/.orbstack/ssh/config -o StrictHostKeyChecking=no"
          # Roles branch on this to skip OS features that don't behave on
          # the OrbStack hypervisor (the /dev/kmsg backfill, the storage
          # role's Mac symlink etc.).
          deployment_target: orbstack
