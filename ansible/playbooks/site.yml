---
# Jterrazz Infrastructure — master playbook.
#
# Usage:
#   Full deploy:   ansible-playbook playbooks/site.yml -i inventories/laptop.yml
#   Platform only: ansible-playbook playbooks/platform.yml -i inventories/ci.yml
#
# The target is Debian 13 (trixie) on the OrbStack VM. There is no dual-distro
# support: templates and package names are Debian-native.

# Every other play needs a Python interpreter for the module payloads, so this
# one runs before fact gathering and talks raw SSH. The current image ships
# python3, hence the `command -v` short-circuit — this exists so a stripped
# image (or a future minbase build) self-heals instead of failing on the very
# first task with "/usr/bin/python3: not found".
- name: Bootstrap Python interpreter
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure python3 is present
      ansible.builtin.raw: command -v python3 || (apt-get update && apt-get install -y python3)
      register: python_bootstrap
      changed_when: "'Setting up python3' in python_bootstrap.stdout"

# Host layer, in dependency order: packages + the /var/lib/k8s-data symlink,
# then sshd/UFW hardening, then Tailscale (systemd-resolved has to be live
# before k3s, whose kubelet pins the resolved uplink resolv.conf), then k3s.
- name: Configure the cluster node
  hosts: cluster
  become: true
  gather_facts: true
  roles:
    - role: base
      tags: [base]
    - role: security
      tags: [security]
    - role: tailscale
      tags: [tailscale, networking]
    - role: k3s
      tags: [k3s]

- name: Platform Services
  ansible.builtin.import_playbook: platform.yml
