---
# Platform Services Playbook — everything above k3s (Helm releases + raw
# manifests). All kubectl/helm commands run ON the node; no external k8s API
# access is needed.
#
# The body lives in roles/platform. Every include there carries a tag, so a
# targeted redeploy is possible:
#
#   ansible-playbook playbooks/platform.yml -i inventories/laptop.yml \
#     -e "@vars.yml" --tags telemetry
#
# This playbook is ALSO run standalone by .github/workflows/deploy-platform.yaml
# (platform layer only, over Tailscale), so it must not assume that the other
# site.yml plays ran in the same invocation.
- name: Platform Services Deployment
  hosts: cluster
  become: true
  gather_facts: true

  roles:
    - role: platform

  post_tasks:
    - name: Cleanup temporary manifests
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: absent
      tags: [always]

    # No version numbers in here. The previous banner listed hand-written
    # versions that had drifted from the actual --version pins, so it
    # confidently reported versions that were never deployed.
    # `platform_chart_versions` in inventories/group_vars/all.yml is what we
    # ask for; `helm list -A` on the node is what is actually running.
    - name: Deployment complete
      ansible.builtin.debug:
        msg: |
          Platform deployment complete.

          Deployed: cert-manager, infisical secrets-operator, cloudflared,
          grafana + loki + tempo + prometheus + otel-collector + alloy,
          librechat, openpanel, registry.

          App chart published to: oci://registry.jterrazz.com/charts/app
          Installed versions:     helm list -A --kubeconfig {{ kubeconfig }}
      tags: [always]
