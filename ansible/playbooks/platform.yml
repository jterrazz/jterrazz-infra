---
# Everything above k3s (Helm releases + raw manifests). All kubectl/helm
# commands run ON the node, so no external k8s API access is needed.
#
# ALSO run standalone by .github/workflows/deploy-platform.yaml, so it must
# never assume the site.yml host-layer plays ran in the same invocation. The
# body is roles/platform, whose includes are tagged for targeted redeploys:
#
#   ansible-playbook playbooks/platform.yml -i inventories/laptop.yml \
#     -e "@vars.yml" --tags telemetry
- name: Platform Services Deployment
  hosts: cluster
  become: true
  gather_facts: true

  roles:
    - role: platform

  post_tasks:
    - name: Cleanup temporary manifests
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: absent
      tags: [always]

    # Deliberately lists NO version numbers: a hand-written banner drifts from
    # the actual --version pins and then confidently reports versions that were
    # never deployed. `helm list -A` is the only honest answer.
    - name: Deployment complete
      ansible.builtin.debug:
        msg: |
          Platform deployment complete.

          Deployed: cert-manager, infisical secrets-operator, cloudflared,
          grafana + loki + tempo + prometheus + otel-collector + alloy,
          librechat, openpanel, registry.

          App chart published to: oci://registry.jterrazz.com/charts/app
          Installed versions:     helm list -A --kubeconfig {{ kubeconfig }}
      tags: [always]
