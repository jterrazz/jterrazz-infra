---
# 8. OpenPanel (self-hosted product analytics)
# Private dashboard on openpanel.jterrazz.com (Tailscale); public event
# ingest on analytics.jterrazz.com (/api/track only, via cloudflared).
# 6 workloads: Postgres + Redis + ClickHouse (stateful, hostPath PVCs) and
# op-api / op-worker / op-dashboard. op-api runs the DB migrations on boot.
# The platform-analytics namespace is declared in
# kubernetes/infrastructure/base/platform-namespaces.yaml and applied by
# infrastructure.yml — it is not created imperatively here.
- name: Apply OpenPanel shared config
  ansible.builtin.command: >
    kubectl apply
    -f {{ manifest_dest }}/kubernetes/platform/openpanel/config.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: openpanel_base_apply
  changed_when: "'created' in openpanel_base_apply.stdout or 'configured' in openpanel_base_apply.stdout"

# Sync secrets from Infisical (/jterrazz-infrastructure/openpanel) before the DBs/apps so their
# envFrom + POSTGRES_PASSWORD resolve on first boot.
- name: Apply OpenPanel Infisical secret
  ansible.builtin.command: kubectl apply -f {{ manifest_dest }}/kubernetes/platform/openpanel/secret.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: openpanel_secret_apply
  changed_when: "'created' in openpanel_secret_apply.stdout or 'configured' in openpanel_secret_apply.stdout"

- name: Wait for openpanel-secrets to be materialized by the Infisical operator
  ansible.builtin.command: kubectl get secret openpanel-secrets -n platform-analytics
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: openpanel_secret_check
  until: openpanel_secret_check.rc == 0
  retries: 30
  delay: 5
  changed_when: false

# NetworkPolicies first so the unauthenticated datastores are firewalled
# to the namespace from the moment they come up.
- name: Apply OpenPanel network policies
  ansible.builtin.command: kubectl apply -f {{ manifest_dest }}/kubernetes/platform/openpanel/netpol.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: openpanel_netpol_apply
  changed_when: "'created' in openpanel_netpol_apply.stdout or 'configured' in openpanel_netpol_apply.stdout"

- name: Deploy OpenPanel datastores (Postgres, Redis, ClickHouse)
  ansible.builtin.command: >
    kubectl apply
    -f {{ manifest_dest }}/kubernetes/platform/openpanel/postgres.yaml
    -f {{ manifest_dest }}/kubernetes/platform/openpanel/redis.yaml
    -f {{ manifest_dest }}/kubernetes/platform/openpanel/clickhouse.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: openpanel_db_apply
  changed_when: "'created' in openpanel_db_apply.stdout or 'configured' in openpanel_db_apply.stdout"

- name: Wait for OpenPanel datastores to be ready
  ansible.builtin.command: kubectl rollout status deployment/{{ item }} -n platform-analytics --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  loop:
    - op-postgres
    - op-redis
    - op-clickhouse
  changed_when: false

# Apps + ingress. op-api migrates on boot, so give it a longer timeout.
- name: Deploy OpenPanel apps and ingress
  ansible.builtin.command: >
    kubectl apply
    -f {{ manifest_dest }}/kubernetes/platform/openpanel/apps.yaml
    -f {{ manifest_dest }}/kubernetes/platform/openpanel/ingress.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: openpanel_apps_apply
  changed_when: "'created' in openpanel_apps_apply.stdout or 'configured' in openpanel_apps_apply.stdout"

- name: Wait for OpenPanel op-api to be ready (runs DB migrations on boot)
  ansible.builtin.command: kubectl rollout status deployment/op-api -n platform-analytics --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  changed_when: false
