---
# ========================================
# Helm setup
# ========================================

- name: Check if Helm is installed
  ansible.builtin.command: which helm
  register: helm_check
  changed_when: false
  failed_when: false

- name: Install Helm
  when: helm_check.rc != 0
  block:
    # Pinned to the v3.20.0 tag, not `main`: the installer script is fetched
    # and executed as root, so tracking a moving branch means an upstream
    # commit can change what runs on the host between two deploys with no
    # change on our side. The tag URL is immutable.
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/v3.20.0/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0755"

    - name: Run Helm install script
      ansible.builtin.command: /tmp/get_helm.sh
      environment:
        DESIRED_VERSION: v3.20.0
      changed_when: true

    - name: Cleanup Helm install script
      ansible.builtin.file:
        path: /tmp/get_helm.sh
        state: absent

- name: Add Helm repositories
  ansible.builtin.command: "helm repo add {{ item.name }} {{ item.url }}"
  loop:
    - { name: jetstack, url: "https://charts.jetstack.io" }
    - { name: community-charts, url: "https://community-charts.github.io/helm-charts" }
    - name: infisical
      url: "https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/"
    - { name: portainer, url: "https://portainer.github.io/k8s/" }
    - { name: grafana, url: "https://grafana.github.io/helm-charts" }
    - { name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts" }
    - { name: open-telemetry, url: "https://open-telemetry.github.io/opentelemetry-helm-charts" }
  register: repo_add
  changed_when: "'has been added' in repo_add.stdout"
  failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: false
