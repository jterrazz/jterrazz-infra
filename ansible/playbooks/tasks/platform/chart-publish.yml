---
# ========================================
# Publish app Helm chart to OCI registry
# ========================================
#
# This DUPLICATES .github/workflows/publish-chart.yaml, deliberately. That
# workflow is the normal path (a chart change on main republishes it); this
# one exists for the fresh-cluster case, where the registry is empty and the
# app CI cannot pull `oci://registry.jterrazz.com/charts/app` at all, so no
# app could deploy until someone hand-ran the workflow.
#
# If the registry already has the chart and you want a faster deploy, skip it:
#   ansible-playbook playbooks/platform.yml ... --skip-tags chart-publish

# helm package writes <name>-<version>.tgz, and the version comes from
# Chart.yaml — so the filename is not knowable here. It used to be recovered
# by parsing `helm package`'s human-readable stdout with
# `stdout.split(': ')[-1]`, which breaks the moment helm changes its output or
# emits a warning line. Packaging into a directory that was just emptied means
# the one file in it IS the chart, whatever it is called.
- name: Reset the chart staging directory
  ansible.builtin.file:
    path: /tmp/app-chart
    state: absent

- name: Create the chart staging directory
  ansible.builtin.file:
    path: /tmp/app-chart
    state: directory
    mode: "0700"

- name: Package app Helm chart
  ansible.builtin.command: helm package {{ manifest_dest }}/kubernetes/charts/app --destination /tmp/app-chart
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  changed_when: true

- name: Locate the packaged chart
  ansible.builtin.find:
    paths: /tmp/app-chart
    patterns: "*.tgz"
  register: packaged_chart

- name: Assert exactly one chart archive was produced
  ansible.builtin.assert:
    that:
      - packaged_chart.files | length == 1
    fail_msg: >-
      Expected exactly one .tgz in /tmp/app-chart after `helm package`, found
      {{ packaged_chart.files | length }}. Refusing to guess which one to push.
    quiet: true

- name: Login to OCI registry for Helm
  ansible.builtin.command:
    argv:
      - helm
      - registry
      - login
      - registry.jterrazz.com
      - --username
      - deploy
      - --password-stdin
    stdin: "{{ registry_password }}"
  no_log: true
  changed_when: false

- name: Push app chart to OCI registry
  ansible.builtin.command: "helm push {{ packaged_chart.files[0].path }} oci://registry.jterrazz.com/charts"
  changed_when: true

- name: Clean up the packaged chart
  ansible.builtin.file:
    path: /tmp/app-chart
    state: absent
