---
# ========================================
# Secrets
# ========================================
# Bootstrap secrets that must exist before the Infisical operator does (the
# operator itself needs credentials, and cert-manager needs the Cloudflare
# token for DNS-01). Everything else is synced from Infisical by the operator.

- name: Create Cloudflare API token secret for networking
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl create secret generic cloudflare-api-token \
        --from-literal=api-token="{{ cloudflare_api_token }}" \
        --namespace platform-networking \
        --dry-run=client -o yaml | kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: net_secret
  changed_when: "'created' in net_secret.stdout or 'configured' in net_secret.stdout"
  no_log: true

- name: Create Infisical credentials secret
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl create secret generic infisical-credentials \
        --from-literal=clientId="{{ infisical_client_id }}" \
        --from-literal=clientSecret="{{ infisical_client_secret }}" \
        --namespace platform-secrets \
        --dry-run=client -o yaml | kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: infisical_secret
  changed_when: "'created' in infisical_secret.stdout or 'configured' in infisical_secret.stdout"
  no_log: true

# n8n encrypts stored credentials with this key. Losing or changing it makes
# every saved credential in the existing n8n database undecryptable, which is
# why it is a required secret rather than something generated per deploy.
- name: Create n8n encryption key secret
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl create secret generic n8n-encryption-key \
        --from-literal=N8N_ENCRYPTION_KEY="{{ n8n_encryption_key }}" \
        --namespace platform-automation \
        --dry-run=client -o yaml | kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: n8n_secret
  changed_when: "'created' in n8n_secret.stdout or 'configured' in n8n_secret.stdout"
  no_log: true
