---
# ========================================
# Base infrastructure manifests
# ========================================
# Namespaces, Traefik config/middleware, NetworkPolicies and the static
# PV definitions.

# Make released PVs available for rebinding (for data persistence across redeployments)
#
# A PV whose PVC was deleted goes to Released and will NOT rebind while it
# still carries the old claimRef, so the app's new PVC stays Pending forever
# and the pod never schedules. This used to be `failed_when: false`, which
# meant a kubectl/RBAC problem here surfaced minutes later as an unexplained
# scheduling failure. Failing loudly with the patch output is the whole point.
- name: Clear claimRef from released PVs
  block:
    - name: Patch released PVs to drop their stale claimRef
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for pv in $(kubectl get pv -o jsonpath='{.items[?(@.status.phase=="Released")].metadata.name}'); do
            kubectl patch pv $pv -p '{"spec":{"claimRef":null}}' --type=merge
          done
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_remote }}"
      register: pv_clear
      changed_when: pv_clear.stdout != ''
  rescue:
    - name: Report the released-PV patch failure
      ansible.builtin.fail:
        msg: >-
          Failed to clear claimRef from Released PVs. Any app whose PVC was
          recreated will stay Pending until this succeeds. kubectl said:
          {{ pv_clear.stderr | default('(no stderr captured)') }}

# The kustomize entrypoint is infrastructure/base. The former
# environments/production overlay added nothing this single-node,
# single-environment cluster needs, so it was removed — the base IS the
# deployed state.
- name: Deploy base infrastructure manifests
  ansible.builtin.command:
    cmd: kubectl apply -k {{ manifest_dest }}/kubernetes/infrastructure/base
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: infra_result
  changed_when: "'created' in infra_result.stdout or 'configured' in infra_result.stdout"
