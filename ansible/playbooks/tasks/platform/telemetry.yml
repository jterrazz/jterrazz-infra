---
# 5. Grafana telemetry stack (Grafana + Loki + Tempo + Prometheus + OTel Collector)
#
# The platform-telemetry namespace is declared in
# kubernetes/infrastructure/base/platform-namespaces.yaml and applied by
# infrastructure.yml — it is not created imperatively here.

# PV nodeAffinity must reference the actual node name (= the OrbStack
# VM's hostname, `jterrazz-infrastructure`). Render the template under
# platform/ where the rest of the telemetry stack lives, so the
# `kubectl apply -k` discovery (if ever used) still finds it.
- name: Ensure telemetry manifest dir exists
  ansible.builtin.file:
    path: "{{ manifest_dest }}/kubernetes/platform/telemetry"
    state: directory
    mode: "0755"

- name: Template telemetry storage manifests with node name
  ansible.builtin.template:
    src: "{{ templates_dir }}/kubernetes/telemetry-storage.yaml.j2"
    dest: "{{ manifest_dest }}/kubernetes/platform/telemetry/storage.yaml"
    mode: "0644"

- name: Apply telemetry storage manifests
  ansible.builtin.command: kubectl apply -f {{ manifest_dest }}/kubernetes/platform/telemetry/storage.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: telemetry_storage_result
  changed_when: "'created' in telemetry_storage_result.stdout or 'configured' in telemetry_storage_result.stdout"

- name: Install Prometheus via Helm
  ansible.builtin.command: >
    helm upgrade --install prometheus prometheus-community/prometheus
    --namespace platform-telemetry
    --version 28.13.0
    --values {{ manifest_dest }}/kubernetes/platform/prometheus/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: prometheus_result
  changed_when: "'has been upgraded' in prometheus_result.stdout or 'has been installed' in prometheus_result.stdout"

- name: Install Loki via Helm
  ansible.builtin.command: >
    helm upgrade --install loki grafana/loki
    --namespace platform-telemetry
    --version 6.53.0
    --values {{ manifest_dest }}/kubernetes/platform/loki/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: loki_result
  changed_when: "'has been upgraded' in loki_result.stdout or 'has been installed' in loki_result.stdout"

- name: Install Tempo via Helm
  ansible.builtin.command: >
    helm upgrade --install tempo grafana/tempo
    --namespace platform-telemetry
    --version 1.24.4
    --values {{ manifest_dest }}/kubernetes/platform/tempo/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: tempo_result
  changed_when: "'has been upgraded' in tempo_result.stdout or 'has been installed' in tempo_result.stdout"

- name: Apply OTel Collector Infisical secret
  ansible.builtin.command: kubectl apply -f {{ manifest_dest }}/kubernetes/platform/otel-collector/secret.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: otel_secret_apply
  changed_when: "'created' in otel_secret_apply.stdout or 'configured' in otel_secret_apply.stdout"

- name: Wait for otel-collector-credentials-env to be materialized by the Infisical operator
  ansible.builtin.command: kubectl get secret otel-collector-credentials-env -n platform-telemetry
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: otel_secret_ready
  until: otel_secret_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Install OpenTelemetry Collector via Helm
  ansible.builtin.command: >
    helm upgrade --install otel-collector open-telemetry/opentelemetry-collector
    --namespace platform-telemetry
    --version 0.158.1
    --values {{ manifest_dest }}/kubernetes/platform/otel-collector/helm.yaml
    --wait
    --timeout 5m
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: otel_result
  changed_when: "'has been upgraded' in otel_result.stdout or 'has been installed' in otel_result.stdout"

# argv form so the admin password is never assembled by a shell, and no_log so
# it never reaches the Ansible output or a CI log.
- name: Install Grafana via Helm
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - grafana
      - grafana/grafana
      - --namespace
      - platform-telemetry
      - --version
      - "10.5.15"
      - --values
      - "{{ manifest_dest }}/kubernetes/platform/grafana/helm.yaml"
      - --set
      - "adminPassword={{ grafana_admin_password }}"
      - --wait
      - --timeout
      - 5m
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: grafana_result
  changed_when: "'has been upgraded' in grafana_result.stdout or 'has been installed' in grafana_result.stdout"
  no_log: true

- name: Deploy Grafana platform resources
  ansible.builtin.command: >
    helm upgrade --install grafana-platform {{ platform_chart }}
    --namespace platform-telemetry
    --values {{ manifest_dest }}/kubernetes/platform/grafana/platform.yaml
    --set infrastructure.nodeName={{ inventory_hostname }}
    --wait
    --timeout 2m
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  register: grafana_platform_result
  changed_when: "'has been upgraded' in grafana_platform_result.stdout or 'has been installed' in grafana_platform_result.stdout"

- name: Deploy Grafana infrastructure dashboards
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      DASHBOARD_DIR="{{ manifest_dest }}/kubernetes/platform/grafana/dashboards"
      for json_file in "$DASHBOARD_DIR"/*.json; do
        [ -f "$json_file" ] || continue
        name="dashboard-$(basename "$json_file" .json)"
        kubectl create configmap "$name" \
          --from-file="$(basename "$json_file")=$json_file" \
          --namespace platform-telemetry \
          --dry-run=client -o yaml | \
        kubectl label -f - --local --dry-run=client -o yaml \
          grafana_dashboard=1 | \
        kubectl annotate -f - --local --dry-run=client -o yaml \
          grafana_folder=infrastructure | \
        kubectl apply -f -
      done
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  changed_when: true

- name: Deploy Grafana alert rules
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - "{{ manifest_dest }}/kubernetes/platform/grafana/alerts/signews-api-alerts.yaml"
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  changed_when: true
