---
# ========================================
# Base infrastructure
# ========================================

# Generous timeout — fresh k3s clusters (and especially the first
# OrbStack VM with no image cache) need several minutes for Traefik's
# Helm-install Job to pull images and complete. `kubectl wait` already
# blocks and polls, so one call with a long deadline replaces the old
# 240-iteration Ansible retry loop that re-ran kubectl every 2 seconds.
- name: Wait for Traefik to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=complete
      - job
      - -l
      - helmcharts.helm.cattle.io/chart=traefik
      - -n
      - kube-system
      - --timeout=480s
  environment:
    KUBECONFIG: "{{ kubeconfig_remote }}"
  changed_when: false

- name: Create manifest directory on VPS
  ansible.builtin.file:
    path: "{{ manifest_dest }}"
    state: directory
    mode: "0755"

- name: Copy infrastructure manifests to VPS
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/"
    dest: "{{ manifest_dest }}/kubernetes/"
    mode: "0644"

# ========================================
# Tailscale IP
# ========================================
# tailscale_ip / tailscale_dns_hostname are set by the tailscale role during a
# full site.yml run. This play is also run on its own by
# .github/workflows/deploy-platform.yaml, which skips the networking play, so
# pull the facts in from the role when they are missing. Single implementation,
# see roles/tailscale/tasks/facts.yml.
- name: Ensure Tailscale facts are available
  ansible.builtin.include_role:
    name: tailscale
    tasks_from: facts
  when: tailscale_ip is not defined

# ========================================
# Cloudflare tunnel hostname — REMOVED
# ========================================
# Public traffic enters via the Cloudflare tunnel, not the host's IP. This
# used to decode the tunnel token (base64 JSON {a:<account>, t:<tunnel>,
# s:<secret>}) into `<tunnel>.cfargotunnel.com` and pass it to the platform
# chart as `infrastructure.publicTarget`, alongside
# `infrastructure.tailscaleHostname`. Neither value is read by any chart
# template any more, so both the facts and the --set flags are gone.
#
# Nothing was lost: the CNAME target for a public hostname is created by
# cloudflared itself when the hostname is added to the tunnel's Public
# Hostnames in the Zero Trust dashboard, and the private hostnames are
# Pulumi-managed in pulumi/src/dns.ts. cloudflare_tunnel_token is still a
# required secret (preflight) because the cloudflared Deployment reads it
# from Infisical.
