---
# Security Hardening Playbook
# Configures SSH, the firewall, unattended upgrades and kernel hardening.

- name: Security Hardening
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Include security role
      ansible.builtin.include_role:
        name: security
      when: not (skip_security | default(false))
      tags: [security, firewall, ssh, updates, sysctl, packages]
