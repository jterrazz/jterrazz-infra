---
# Kubernetes (k3s) Playbook

- name: Kubernetes Setup
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Create k3s directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ k3s_config_dir }}"
        - "{{ k3s_data_dir }}"
        - /var/log/k3s
      tags: [k3s]

  roles:
    - role: k3s
      tags: [k3s]

  post_tasks:
    - name: Fetch kubeconfig to local machine
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../../kubeconfig.yaml"
        flat: true
      tags: [k3s, kubeconfig]

    # Rewrite the loopback server URL to something reachable FROM THE LAPTOP.
    #
    # This must be the Tailscale MagicDNS name, not `ansible_host`: on the
    # OrbStack target ansible_host is `orb`, an SSH-config alias that no
    # resolver knows about, so the fetched kubeconfig pointed at
    # https://orb:6443 and every kubectl call against it failed with a DNS
    # error. The MagicDNS name works from any tailnet client and is in the
    # API server's TLS SANs (see roles/k3s/templates/config.yaml.j2), so the
    # certificate verifies too. Falls back to the tailnet IP, then to
    # ansible_host, if Tailscale is not up.
    # Match both loopback spellings: k3s writes 127.0.0.1 by default but
    # 0.0.0.0 when the API server binds all interfaces (as ours does).
    - name: Update kubeconfig server address
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../../kubeconfig.yaml"
        regexp: 'https://(127\.0\.0\.1|0\.0\.0\.0):6443'
        replace: "https://{{ tailscale_dns_hostname | default('') or tailscale_ip | default('') or ansible_host }}:6443"
      delegate_to: localhost
      become: false
      tags: [k3s, kubeconfig]

    - name: Wait for k3s API server
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 6443
        delay: 5
        timeout: 120
      tags: [k3s]
