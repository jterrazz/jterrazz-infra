---
# platform-analytics (OpenPanel). k3s enforces NetworkPolicy, so this is real
# isolation: ClickHouse, Postgres and Redis run WITHOUT passwords (upstream
# design), and these policies are the only thing keeping another namespace off
# them.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-analytics
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: platform-analytics
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # OpenPanel's own pods -> each other (apps to datastores); sourced by the
    # namespace label, so nothing outside platform-analytics matches.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-analytics

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-frontends
  namespace: platform-analytics
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - op-api
          - op-dashboard
  policyTypes:
    - Ingress
  ingress:
    # Traefik (kube-system) -> op-api and op-dashboard on 3000, i.e. both
    # IngressRoutes in kubernetes/services/openpanel/ingress.yaml. op-worker
    # is excluded by the podSelector and stays same-namespace only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 3000
          protocol: TCP

---
# Egress is DEFAULT-DENY for every pod in the namespace (podSelector {} +
# policyTypes: Egress), so each rule below is load-bearing — an OpenPanel flow
# not listed here stops working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-analytics
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # All op-* pods -> CoreDNS on 53; namespace-wide because a pod resolves
    # before it can know which namespace answered.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # op-api / op-worker / op-dashboard -> the three datastores in this same
    # namespace (Postgres 5432, Redis 6379, ClickHouse 8123 HTTP + 9000 native).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-analytics
    # op-dashboard SSR -> Traefik (kube-system) on 443: it fetches its OWN
    # public URL from inside the pod and coredns-custom maps that host to
    # Traefik's ClusterIP. Without this /onboarding fails with
    # `[tRPC SSR Error] fetch failed`.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 443
    # op-* pods -> the internet on 443 (geo/IP enrichment, avatar fetches);
    # deliberately un-narrowed, see issue #3.
    - ports:
        - protocol: TCP
          port: 443
