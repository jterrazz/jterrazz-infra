---
# platform-registry (the private Docker registry).
#
# The registry holds every application image and its push credentials are
# htpasswd-only, so it is the crown jewel of the cluster. Nothing but Traefik
# legitimately reaches port 5000: containerd on the node and CI runners on the
# tailnet both resolve registry.jterrazz.com and terminate at Traefik, which
# then dials the registry Service.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Pods in platform-registry -> each other; sourced by the namespace label.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-registry

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-registry
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Traefik (kube-system) -> registry:5000. Every pull and push arrives this
    # way; there is no direct ClusterIP consumer.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 5000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # registry -> CoreDNS on 53; namespace-wide because a pod resolves before
    # it can know which namespace answered.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # registry -> the internet on 443. Storage is a local hostPath PVC, so in
    # principle DNS alone would do; kept open per issue #3 because this
    # namespace is on the critical path for every app deploy.
    - ports:
        - protocol: TCP
          port: 443
