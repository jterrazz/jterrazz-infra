---
# platform-secrets — the Infisical secrets-operator, and nothing else.
#
# The pod here holds the machine-identity credentials for the whole Infisical
# project (Secret `infisical-credentials`, written by
# roles/platform/tasks/bootstrap-services.yml) and mints Kubernetes Secrets from
# them in EVERY namespace. It is the most privileged workload in the cluster, and
# the thing to notice about that privilege is where it flows: entirely through
# the API server, never over a pod-to-pod connection. So it needs no ingress at
# all, and the only egress it needs is "Infisical" plus "the apiserver".
#
# Checked against the rendered chart (secrets-operator 0.11.5), not assumed:
# there are no Validating/MutatingWebhookConfigurations and no admission Service
# — the only Service is `…-controller-manager-metrics-service` on 8443, which
# carries no prometheus.io/scrape annotation and is therefore not a target of
# victoria-metrics' kubernetes-service-endpoints job. Nothing in the cluster
# dials this namespace.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # NO ingress rules, on purpose. Two things that look like they need one, and
  # do not:
  #   * the API server. Operators are clients of the apiserver, not servers to
  #     it — there is no webhook here for it to call back into (verified above).
  #     Contrast platform-networking, which DOES need a 10250 hole because
  #     cert-manager registers an admission webhook.
  #   * the kubelet's health probes on :8081 (--health-probe-bind-address).
  #     Those are sourced from the node rather than from a pod, and k3s'
  #     NetworkPolicy enforcement does not filter them.
  # If Infisical's "Instant Updates" (Event Subscriptions) is ever enabled, note
  # that it is still an OUTBOUND watch from the operator — it does not turn this
  # namespace into a webhook receiver.

---
# Egress is DEFAULT-DENY (podSelector {} + policyTypes: Egress). Three rules,
# and the operator stops working if any of them goes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-secrets
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # operator -> CoreDNS on 53. Needed twice over: to resolve
    # eu.infisical.com, and to resolve kubernetes.default.svc.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # operator -> https://eu.infisical.com (every InfisicalSecret's `hostAPI`),
    # AND -> the kube-apiserver, which is the same rule because on this cluster
    # they are the same destination shape.
    #
    # NOTE THE MISSING `except`, and do not "tidy" it into the
    # `0.0.0.0/0 except RFC1918` form platform-networking uses. The apiserver is
    # RFC1918 twice: the pod dials the `kubernetes` Service ClusterIP
    # (10.43.0.1:443), which iptables DNATs to the node's own address
    # (192.168.x.x:6443). Excluding 10/8 and 192.168/16 would cut the operator
    # off from the API server — i.e. from writing a single Secret — while
    # leaving the Infisical fetch working, so the failure would read as "auth
    # broke", not "netpol broke". Both ports are listed because which one the
    # filter sees depends on whether it runs before or after DNAT.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
