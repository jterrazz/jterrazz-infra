---
# Storage Classes
#
# Two storage options available:
#
# 1. local-path (K3s built-in) - For ephemeral data
#    - Dynamic provisioning
#    - Data deleted when PVC is deleted
#    - Location: /var/lib/rancher/k3s/storage/
#
# 2. manual - For persistent data that survives app deletion
#    - Static provisioning (requires pre-created PV)
#    - Data retained when PVC is deleted (Retain policy)
#    - Location: /var/lib/k8s-data/  (on OrbStack: a symlink to the Mac, so
#      the data also survives a `pulumi destroy` repave)
#    - Layout convention: one directory per app; a multi-component app nests
#      its volumes under <app>/ (e.g. librechat/{mongo,uploads},
#      openpanel/{postgres,redis,clickhouse}).
#
#    Every `manual` PV/PVC in the cluster is now declared by one of the two
#    charts — the hand-written and Ansible-templated ones are gone:
#      service chart (kubernetes/charts/service, `storage` map in each
#        kubernetes/services/<svc>/service.yaml):
#          grafana-data, prometheus-data, loki-data, tempo-data,
#          registry-data, librechat-data, librechat-uploads,
#          openpanel-postgres, openpanel-redis, openpanel-clickhouse
#        (loki and tempo override the PVC name to storage-loki-0 /
#         storage-tempo-0 — their StatefulSet volumeClaimTemplates impose it)
#      app chart (kubernetes/charts/app): <app>-<env>-data, for any app that
#        sets spec.storage

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
