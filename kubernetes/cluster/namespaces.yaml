---
# Platform Namespaces
#
# Every platform namespace is declared here — no imperative `kubectl create
# ns`, no per-service namespace manifest. Uniform convention: one
# `app.kubernetes.io/component` label naming the namespace's role (the suffix
# after `platform-`).
#
# Applied with the rest of this directory via `kubectl apply -f -R
# kubernetes/cluster` (the kustomization.yaml that used to wrap these files is
# gone — it was a flat resource list with two cosmetic labels and nothing
# selected on either).

apiVersion: v1
kind: Namespace
metadata:
  name: platform-networking
  labels:
    app.kubernetes.io/component: networking

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-registry
  labels:
    app.kubernetes.io/component: registry

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-secrets
  labels:
    app.kubernetes.io/component: secrets

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-ai
  labels:
    app.kubernetes.io/component: ai

---
# Grafana / Prometheus / Loki / Tempo / OTel Collector / Alloy.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-telemetry
  labels:
    app.kubernetes.io/component: telemetry

---
# OpenPanel (self-hosted product analytics).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-analytics
  labels:
    app.kubernetes.io/component: analytics

---
# The gateway app's namespace, pre-declared here (not by its CI) because
# network-policies/prod-gateway-intelligence.yaml — applied in the same
# cluster-base pass — must land in an existing namespace on a fresh cluster,
# before the app's first deploy. Helm's --create-namespace adopts it as-is.
# kubectl walks this directory lexically, so namespaces.yaml sorts before
# network-policies/ — the ordering this relies on.
apiVersion: v1
kind: Namespace
metadata:
  name: prod-gateway-intelligence
  labels:
    app.kubernetes.io/component: app-gateway

# REMOVED namespaces (they died with their only tenant; the namespace object
# is dropped rather than left empty, so `kubectl get ns` stays an honest
# inventory of what runs here):
#   platform-management  <- Portainer. Deleted; kubectl + the Grafana
#                           dashboards cover what it was used for, and it held
#                           a cluster-admin ServiceAccount reachable over HTTP,
#                           which made it the highest-value target in the
#                           cluster.
#   platform-automation  <- n8n. Deleted; no workflows were in use.
# Their hostPath data under /var/lib/k8s-data/{portainer,n8n} is untouched —
# the PVs were Retain — so either can be resurrected from git history plus
# that directory.
