---
# Every platform namespace is declared here — no imperative `kubectl create
# ns`, no per-service namespace manifest. Applied with the rest of this
# directory by `kubectl apply -f -R kubernetes/cluster`
# (ansible/roles/platform/tasks/cluster-manifests.yml).

apiVersion: v1
kind: Namespace
metadata:
  name: platform-networking
  labels:
    app.kubernetes.io/component: networking

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-registry
  labels:
    app.kubernetes.io/component: registry

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-secrets
  labels:
    app.kubernetes.io/component: secrets

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-ai
  labels:
    app.kubernetes.io/component: ai

---
# Grafana / Prometheus / Loki / Tempo / OTel Collector / Alloy.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-telemetry
  labels:
    app.kubernetes.io/component: telemetry

---
# OpenPanel (self-hosted product analytics).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-analytics
  labels:
    app.kubernetes.io/component: analytics

---
# The gateway app's namespace, pre-declared here (not by its CI) because
# network-policies/prod-gateway-intelligence.yaml — applied in the same
# cluster-manifests pass — must land in an existing namespace on a fresh cluster,
# before the app's first deploy. Helm's --create-namespace adopts it as-is.
# kubectl walks this directory lexically, so namespaces.yaml sorts before
# network-policies/ — the ordering this relies on.
apiVersion: v1
kind: Namespace
metadata:
  name: prod-gateway-intelligence
  labels:
    app.kubernetes.io/component: app-gateway
