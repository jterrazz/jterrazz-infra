# Shared non-secret env for op-api / op-worker / op-dashboard, via envFrom;
# secrets come from the Infisical-synced `openpanel-secrets` (secret.yaml).
# DASHBOARD_URL / API_URL are the PRIVATE host only — the public ingest host
# analytics.jterrazz.com carries /api/track alone, configured per sending site.
#
# API_URL_SSR IS INERT: dashboard image 2.2.1 predates the commit that added it
# (2026-07-01) and is still the newest published tag; at that tree SSR and the
# browser shared ONE url. So the dashboard's SSR fetch of its own public URL
# rests on THREE things together — the host in `private_hostnames_via_traefik`
# (group_vars/all.yml), the kube-system:443 egress rule in
# cluster/network-policies/platform-analytics.yaml, and ingress.yaml using
# `cluster-internal-access`; remove one and /onboarding fails with
# `[tRPC SSR Error] fetch failed`. TO RETIRE: move to a dashboard image newer
# than 2026-07-01, verify SSR, then drop the hostname from
# private_hostnames_via_traefik + PRIVATE_CHECKS and re-tighten to private-access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openpanel-config
  namespace: platform-analytics
data:
  NODE_ENV: "production"
  SELF_HOSTED: "true"
  BATCH_SIZE: "5000"
  BATCH_INTERVAL: "10000"
  ALLOW_INVITATION: "true"
  # ALLOW_REGISTRATION is deliberately NOT here: it is a per-container env in
  # apps.yaml so the true/false flip stays greppable.
  REDIS_URL: "redis://op-redis:6379"
  # The /openpanel path segment is the DB init-db.sh creates.
  CLICKHOUSE_URL: "http://op-clickhouse:8123/openpanel"
  DASHBOARD_URL: "https://openpanel.internal.jterrazz.com"
  API_URL: "https://openpanel.internal.jterrazz.com/api"
  API_URL_SSR: "http://op-api:3000"
  # Browser origins allowed to POST events to /api/track on the public host.
  # jterrazz.com + www.jterrazz.com are LIVE senders (the externally-hosted
  # site posts here directly); the rest are pre-authorised and cost nothing.
  # There is no shared SDK — each site integrates OpenPanel's browser snippet
  # itself, so adding a sender means adding its apex (and www./sub) here.
  API_CORS_ORIGINS: "https://openpanel.internal.jterrazz.com,https://jterrazz.com,https://www.jterrazz.com,https://spwn.sh,https://sig.news,https://clawssify.com,https://clawrr.com"
  # Postgres bootstrap (non-secret half; password is in the Secret).
  POSTGRES_USER: "openpanel"
  POSTGRES_DB: "openpanel"
