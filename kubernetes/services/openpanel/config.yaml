# Shared non-secret env for op-api / op-worker / op-dashboard, consumed via
# envFrom. Secrets (DB URL, cookie secret) come from the Infisical-synced
# `openpanel-secrets` Secret instead — see secret.yaml.
#
# URL model:
#   DASHBOARD_URL / API_URL  -> the PRIVATE host only. The public ingest host
#     analytics.jterrazz.com is deliberately absent: it carries /api/track
#     alone, and each sending site configures that URL on its own side.
#   API_URL_SSR -> in-cluster op-api Service, meant to bypass the ingress for
#     server-side rendering. Image 2.2 is NOT observed to honor it, which is
#     why `openpanel.jterrazz.com` is in private_hostnames_via_traefik
#     (ansible/inventories/group_vars/all.yml). Both can go once 2.2+ honors
#     it — see issue #3.
#   CLICKHOUSE_URL path segment /openpanel = the DB created by init-db.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openpanel-config
  namespace: platform-analytics
data:
  NODE_ENV: "production"
  SELF_HOSTED: "true"
  BATCH_SIZE: "5000"
  BATCH_INTERVAL: "10000"
  ALLOW_INVITATION: "true"
  # ALLOW_REGISTRATION is deliberately NOT here: it is a per-container env in
  # apps.yaml so the true/false flip stays greppable.
  REDIS_URL: "redis://op-redis:6379"
  CLICKHOUSE_URL: "http://op-clickhouse:8123/openpanel"
  DASHBOARD_URL: "https://openpanel.jterrazz.com"
  API_URL: "https://openpanel.jterrazz.com/api"
  API_URL_SSR: "http://op-api:3000"
  # Browser origins allowed to POST events to /api/track on the public host.
  # jterrazz.com + www.jterrazz.com are LIVE senders (the externally-hosted
  # site posts here directly); the rest are pre-authorised and cost nothing.
  # There is no shared SDK — each site integrates OpenPanel's browser snippet
  # itself, so adding a sender means adding its apex (and www./sub) here.
  API_CORS_ORIGINS: "https://openpanel.jterrazz.com,https://jterrazz.com,https://www.jterrazz.com,https://spwn.sh,https://sig.news,https://clawssify.com,https://clawrr.com"
  # Postgres bootstrap (non-secret half; password is in the Secret).
  POSTGRES_USER: "openpanel"
  POSTGRES_DB: "openpanel"
