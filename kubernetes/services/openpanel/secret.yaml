# Syncs OpenPanel's secrets into the `openpanel-secrets` Secret, consumed as
# envFrom by op-api / op-worker / op-dashboard and by the Postgres Deployment.
#
# Required keys in Infisical /jterrazz-infrastructure/openpanel:
#   POSTGRES_PASSWORD    strong random — Postgres superuser password
#   DATABASE_URL         postgresql://openpanel:<POSTGRES_PASSWORD>@op-postgres:5432/openpanel
#   DATABASE_URL_DIRECT  same as DATABASE_URL (no pooler here; used by migrations)
#   COOKIE_SECRET        32+ byte random — session/cookie signing
#
# ClickHouse and Redis have NO credential to store: they run unauthenticated
# and are isolated by
# kubernetes/cluster/network-policies/platform-analytics.yaml. Email
# (RESEND_API_KEY/SMTP) is omitted on purpose — no invitations or resets.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: openpanel-infisical
  namespace: platform-analytics
spec:
  hostAPI: https://eu.infisical.com
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: jterrazz
        envSlug: prod
        secretsPath: /jterrazz-infrastructure/openpanel
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: platform-secrets
  managedSecretReference:
    secretName: openpanel-secrets
    secretNamespace: platform-analytics
    secretType: Opaque
