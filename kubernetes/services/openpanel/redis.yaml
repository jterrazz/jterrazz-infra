# Redis for OpenPanel — the BullMQ job queue + event buffer, NOT an evictable
# cache. Hence `--maxmemory-policy noeviction` (never drop queued jobs) and
# `--appendonly yes` (in-flight events survive a restart). No auth, so
# kubernetes/cluster/network-policies/platform-analytics.yaml is the only
# thing keeping other namespaces off it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-redis
  namespace: platform-analytics
  labels:
    app: op-redis
    app.kubernetes.io/part-of: openpanel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: op-redis
  template:
    metadata:
      labels:
        app: op-redis
    spec:
      # hostPath dirs are created root-owned. The redis entrypoint would chown
      # /data itself and su-exec down, but pinning uid 999 below means that
      # branch never runs — and AOF durability depends on this write access.
      initContainers:
        - name: fix-perms
          image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ["sh", "-c", "chown -R 999:1000 /data"]
          # Root, but every capability dropped except the three `chown -R`
          # needs: CHOWN to change ownership, FOWNER + DAC_OVERRIDE to
          # traverse and modify dirs root does not own.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: redis
          # Latest 7.x. Deliberately NOT 8.x: OpenPanel's self-hosting compose
          # pins redis:7.2.5-alpine and neither OpenPanel nor BullMQ publishes
          # any statement supporting Redis 8, so 8.x would be two uncited
          # assumptions under the job queue. 7.4 is a minor bump inside the
          # line upstream pins — verified to start under this manifest's exact
          # uid (999:1000) and args (noeviction + appendonly).
          # NOTE: 7.4's RDB/AOF are not readable by 7.2, so this is forward-
          # only — acceptable because this volume is a rebuildable queue, not
          # a source of truth.
          image: redis:7.4.9-alpine
          # uid 999 / gid 1000 is the image's `redis` user — the official image
          # creates the group at 1000 and the user at 999, hence the mismatch.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - "redis-server"
            - "--maxmemory-policy"
            - "noeviction"
            - "--appendonly"
            - "yes"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openpanel-redis
---
apiVersion: v1
kind: Service
metadata:
  name: op-redis
  namespace: platform-analytics
  labels:
    app: op-redis
spec:
  selector:
    app: op-redis
  ports:
    - port: 6379
      targetPort: 6379
