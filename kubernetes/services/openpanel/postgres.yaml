# PostgreSQL for OpenPanel (orgs, projects, dashboards, users). Upstream
# self-hosting pins postgres:14-alpine. Recreate strategy — never two writers
# on one RWO hostPath volume. Data is on the `openpanel-postgres` manual
# hostPath PV/PVC (service.yaml, Retain) so it survives a repave.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-postgres
  namespace: platform-analytics
  labels:
    app: op-postgres
    app.kubernetes.io/part-of: openpanel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: op-postgres
  template:
    metadata:
      labels:
        app: op-postgres
    spec:
      # hostPath dirs are created root-owned. The postgres entrypoint would
      # chown PGDATA itself and su-exec down, but pinning uid 70 below means
      # that branch never runs. 70:70 is correct for the ALPINE variant ONLY —
      # the Debian-based postgres images use 999.
      initContainers:
        - name: fix-perms
          image: busybox:1.37@sha256:e226d6308690dbe282443c8c7e57365c96b5228f0fe7f40731b5d84d37a06839
          command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql/data"]
          # Root, but every capability dropped except the three `chown -R`
          # needs: CHOWN to change ownership, FOWNER + DAC_OVERRIDE to
          # traverse and modify dirs root does not own.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:14-alpine
          # uid/gid 70 is the alpine image's `postgres` user — the same uid the
          # initContainer above chowns to.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openpanel-secrets
                  key: POSTGRES_PASSWORD
            # Keep PGDATA in a subdir so lost+found / hostPath root never
            # collides with initdb's empty-dir check.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openpanel-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: op-postgres
  namespace: platform-analytics
  labels:
    app: op-postgres
spec:
  selector:
    app: op-postgres
  ports:
    - port: 5432
      targetPort: 5432
