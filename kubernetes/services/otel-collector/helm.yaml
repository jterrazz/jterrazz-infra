image:
  repository: otel/opentelemetry-collector-contrib

mode: deployment
replicaCount: 1

# No manual GOMEMLIMIT: this chart auto-injects it at 80% of
# resources.limits.memory.

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 256Mi

# Pins the Service DNS name every consumer's OTEL_EXPORTER_OTLP_ENDPOINT uses
# (see app.platformCatalog in kubernetes/charts/app/templates/_helpers.tpl).
fullnameOverride: otel-collector

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# Consumed via ${env:LANGFUSE_BASIC_AUTH} in the otlphttp/langfuse exporter
# below; the Secret is synced by secret.yaml in this directory.
extraEnvs:
  - name: LANGFUSE_BASIC_AUTH
    valueFrom:
      secretKeyRef:
        name: otel-collector-secrets
        key: LANGFUSE_BASIC_AUTH

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    # NOTE the inversion: the filter processor DROPS what its condition
    # matches, so this condition matches everything that is NOT a GenAI span.
    # error_mode: ignore keeps a span that errors evaluating the condition
    # (e.g. missing attribute) flowing rather than crashing the pipeline.
    filter/genai:
      error_mode: ignore
      traces:
        span:
          - 'not (IsMatch(name, "^ai\\..*") or attributes["gen_ai.operation.name"] != nil)'

  exporters:
    otlphttp/tempo:
      endpoint: http://tempo.platform-telemetry.svc:4318
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki.platform-telemetry.svc:3100/otlp
      tls:
        insecure: true
    prometheusremotewrite:
      endpoint: http://prometheus-server.platform-telemetry.svc:80/api/v1/write
      tls:
        insecure: true
      # Promotes service.name / deployment.environment to Prometheus labels.
      # Without it an app's prod/next/staging series collide into one. Safe
      # because app metric resources here carry only those two attributes.
      resource_to_telemetry_conversion:
        enabled: true
    otlphttp/langfuse:
      # Must stay an otlphttp exporter: Langfuse's OTLP endpoint accepts
      # OTLP/HTTP only, never gRPC (4317).
      endpoint: https://cloud.langfuse.com/api/public/otel
      headers:
        Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}"

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/tempo]
      # Fan-out, in addition to the traces->Tempo pipeline above.
      traces/langfuse:
        receivers: [otlp]
        processors: [filter/genai, batch]
        exporters: [otlphttp/langfuse]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheusremotewrite]
