# Service-chart values for the private container registry: IngressRoute,
# Certificate and the hostPath PV/PVC. The Deployment + Service (and the
# htpasswd Secret Ansible bootstraps) are in deployment.yaml next to this file.
name: registry
host: registry.internal.jterrazz.com
port: 5000

# cluster-internal-access, NOT private-access: containerd's hairpin pull for
# registry.internal.jterrazz.com is sourced from a pod-CIDR or node address, not a
# tailnet IP, so private-access would reject the cluster's own image pulls.
access: cluster-internal

storage:
  # Load-bearing on OrbStack: without an explicit `manual` hostPath volume the
  # PVC binds to local-path under /var/lib/rancher/k3s/storage/, which a
  # `pulumi destroy && pulumi up` wipes — every registry blob with it.
  data:
    size: 10Gi

# TEMPORARY, for the registry.jterrazz.com -> registry.internal.jterrazz.com
# rename. Serving both names from one route and one certificate means no window
# exists in which a consumer still holding the old name breaks: running pods
# keep pulling, CI keeps pushing, whichever name they use.
#
# REMOVE (and drop the old CNAME with `pulumi up`) once every app has been
# redeployed from the new name — verify with:
#   kubectl get pods -A -o jsonpath='{..image}' | tr ' ' '\n' \
#     | grep -c 'registry\.jterrazz\.com/' # must be 0
aliases:
  - registry.jterrazz.com
