# Private container registry — Deployment + Service only. The
# IngressRoute/Certificate/PV/PVC come from the service chart (service.yaml in
# this directory).
#
# AUTH is htpasswd because the registry image offers only that or `token`,
# and `token` needs a whole separate JWT-issuing server for a single-user
# registry. ONE account (`deploy`), bcrypt-hashed; the hash is in Secret
# `registry-auth` key `htpasswd`, bootstrapped by
# ansible/roles/platform/tasks/registry.yml because a password hash must never
# be committed. Consequence: CI pushes and containerd's node-level pulls share
# one credential, so rotating means re-running that task AND updating
# DOCKER_REGISTRY_PASSWORD in Infisical. The other half of the story is
# kubernetes/cluster/network-policies/platform-registry.yaml — nothing but
# Traefik reaches :5000 at all.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: platform-registry
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2.8
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_AUTH
              value: "htpasswd"
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: "Registry"
            # /auth is the `auth` volume below; `htpasswd` is the Secret key.
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: "/auth/htpasswd"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            # Do not lower: a tight limit makes Go's GC thrash while streaming
            # a large blob, throughput collapses to ~0.6MB/s, and buildkit's
            # ~60s upload timeout fires — surfacing as "blob upload invalid"
            # on the retried, wrong-offset resume rather than as an OOM.
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            # From the service chart (service.yaml -> storage.data).
            claimName: registry-data
        - name: auth
          secret:
            # Bootstrapped by ansible/roles/platform/tasks/registry.yml.
            secretName: registry-auth
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: platform-registry
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: registry
