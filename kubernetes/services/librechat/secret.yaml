# Syncs LibreChat's secrets into the `librechat-credentials-env` Secret, whose
# name the chart hardcodes for its envFrom (see helm.yaml existingSecretName).
#
# Required keys in Infisical /jterrazz-infrastructure/librechat:
#   CREDS_KEY           32-byte hex  (LibreChat credential encryption)
#   CREDS_IV            16-byte hex
#   JWT_SECRET          random
#   JWT_REFRESH_SECRET  random
#
# No gateway key: the gateway does no client-key auth (netpol-only) and
# LibreChat passes a non-secret placeholder — see helm.yaml.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: librechat-infisical
  namespace: platform-ai
spec:
  hostAPI: https://eu.infisical.com
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: jterrazz
        envSlug: prod
        secretsPath: /jterrazz-infrastructure/librechat
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: platform-secrets
  # Name MUST be librechat-credentials-env: that's the secret the LibreChat
  # chart wires as envFrom (its `existingSecretName`). Naming it anything else
  # means CREDS_KEY / CREDS_IV / JWT_* never reach the container.
  managedSecretReference:
    secretName: librechat-credentials-env
    secretNamespace: platform-ai
    secretType: Opaque
