# Standalone MongoDB for LibreChat.
#
# Replaces the LibreChat chart's bundled Bitnami mongodb subchart (deprecated
# 2025-09, broken to pull). Single-node, no auth — it only listens inside the
# platform-ai namespace and the cluster has no other tenants on this DB. Add
# auth (and a Secret-injected MONGO_URI) before this is anything but private.
#
# Data lives on the manual hostPath PVC `librechat-data` created by the
# service chart (service.yaml). Recreate strategy: never run two writers
# against one RWO hostPath volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-mongodb
  namespace: platform-ai
  labels:
    app: librechat-mongodb
    app.kubernetes.io/part-of: librechat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat-mongodb
  template:
    metadata:
      labels:
        app: librechat-mongodb
    spec:
      # hostPath dirs are created root-owned. The mongo image's entrypoint
      # normally chowns /data/db itself and gosu's down to the mongodb user,
      # but we pin the container to uid 999 below so that entrypoint branch
      # never runs — hence this explicit chown, matching the pattern used by
      # the app chart and by openpanel's datastores.
      initContainers:
        - name: fix-perms
          image: busybox:1.37@sha256:e226d6308690dbe282443c8c7e57365c96b5228f0fe7f40731b5d84d37a06839
          command: ["sh", "-c", "chown -R 999:999 /data/db"]
          # Must stay root to chown, but keeps every other guardrail: no
          # privilege escalation, seccomp on, and all capabilities dropped
          # except the three `chown -R` needs (CHOWN to change ownership,
          # FOWNER + DAC_OVERRIDE to traverse/modify dirs root does not own).
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data/db
      containers:
        - name: mongodb
          # Pinned to the 7.0 minor, not the floating `7`. A silent jump to a
          # new minor rewrites on-disk feature-compatibility metadata, which
          # is a one-way door for this hostPath data — mongod refuses to start
          # against files written by a newer release. Bump deliberately, and
          # set featureCompatibilityVersion before/after.
          image: mongo:7.0
          # mongod runs as the image's `mongodb` user (uid/gid 999); the
          # initContainer above hands it a correctly-owned data dir.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - "--quiet"
            - "--wiredTigerCacheSizeGB"
            - "0.25"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 384Mi
          # TCP probe, not `mongosh --eval`: mongosh is a heavy Node REPL whose
          # cold-start alone exceeds the 1s default probe timeout, so the exec
          # probe timed out on ~every check → 57 liveness-kills / crash-loop
          # (the storage engine also needs ~3s to open on the Mac hostPath).
          # A listening port 27017 means mongod is up and accepting connections.
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librechat-data
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-mongodb
  namespace: platform-ai
  labels:
    app: librechat-mongodb
    app.kubernetes.io/part-of: librechat
spec:
  selector:
    app: librechat-mongodb
  ports:
    - port: 27017
      targetPort: 27017
