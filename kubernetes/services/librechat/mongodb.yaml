# Standalone MongoDB for LibreChat, in place of the chart's bundled Bitnami
# subchart. No auth: it listens only inside platform-ai and has no other
# tenants — add auth (and a Secret-injected MONGO_URI) before this is anything
# but private. Data is on the manual hostPath PVC `librechat-data`
# (platform.yaml), hence Recreate: never two writers on one RWO hostPath volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-mongodb
  namespace: platform-ai
  labels:
    app: librechat-mongodb
    app.kubernetes.io/part-of: librechat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat-mongodb
  template:
    metadata:
      labels:
        app: librechat-mongodb
    spec:
      # hostPath dirs are created root-owned. The mongo entrypoint would chown
      # /data/db itself and gosu down, but pinning the container to uid 999
      # below means that branch never runs — hence this explicit chown.
      initContainers:
        - name: fix-perms
          image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ["sh", "-c", "chown -R 999:999 /data/db"]
          # Root with only the `chown -R` capabilities — see
          # kubernetes/charts/app/templates/deployment.yaml for why these three.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data/db
      containers:
        - name: mongodb
          # ONE-WAY DOOR: pinned to the 7.0 minor, never the floating `7`. A
          # minor jump rewrites on-disk feature-compatibility metadata and
          # mongod then refuses to start against files a newer release wrote.
          # Bump deliberately, setting featureCompatibilityVersion either side.
          #
          # HELD AT 7.0 ON PURPOSE (re-evaluated 2026-07-26). LibreChat does
          # support MongoDB 8 — its own docker-compose.yml pins mongo:8.0.20,
          # on main and at the v0.8.7 tag — but 8.0 CANNOT RUN ON THIS HOST:
          #
          #   MongoDB cannot start: Linux kernel versions 6.19 and newer has a
          #   known incompatibility with this version of MongoDB.
          #   (SERVER-121912)
          #
          # This node is an OrbStack machine and OrbStack machines share the
          # OrbStack kernel, which is 7.0.11-orbstack. Measured, not assumed:
          # `mongo:8.0` exits 1 immediately, `mongo:7.0` and `mongo:8.2` both
          # start and answer ping. So the version LibreChat cites (8.0) is
          # unbootable here, and the version that boots (8.2) is outside the
          # line LibreChat cites — and the FCV bump is irreversible.
          #
          # Revisit when an 8.0.x patch carrying the SERVER-121912 fix ships:
          # retest with `docker run --rm mongo:8.0 --version`, and only then
          # run the 7.0 -> 8.0 procedure.
          image: mongo:7.0
          # uid/gid 999 is the image's `mongodb` user — the same uid the
          # initContainer above chowns to.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - "--quiet"
            - "--wiredTigerCacheSizeGB"
            - "0.25"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 384Mi
          # TCP probe, NOT `mongosh --eval`: mongosh is a heavy Node REPL whose
          # cold start alone exceeds the default 1s probe timeout, which
          # crash-loops the pod on liveness kills.
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librechat-data
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-mongodb
  namespace: platform-ai
  labels:
    app: librechat-mongodb
    app.kubernetes.io/part-of: librechat
spec:
  selector:
    app: librechat-mongodb
  ports:
    - port: 27017
      targetPort: 27017
