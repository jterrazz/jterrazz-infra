# Standalone MongoDB for LibreChat, in place of the chart's bundled Bitnami
# subchart. No auth: it listens only inside platform-ai and has no other
# tenants — add auth (and a Secret-injected MONGO_URI) before this is anything
# but private. Data is on the manual hostPath PVC `librechat-data`
# (service.yaml), hence Recreate: never two writers on one RWO hostPath volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-mongodb
  namespace: platform-ai
  labels:
    app: librechat-mongodb
    app.kubernetes.io/part-of: librechat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat-mongodb
  template:
    metadata:
      labels:
        app: librechat-mongodb
    spec:
      # hostPath dirs are created root-owned. The mongo entrypoint would chown
      # /data/db itself and gosu down, but pinning the container to uid 999
      # below means that branch never runs — hence this explicit chown.
      initContainers:
        - name: fix-perms
          image: busybox:1.37@sha256:e226d6308690dbe282443c8c7e57365c96b5228f0fe7f40731b5d84d37a06839
          command: ["sh", "-c", "chown -R 999:999 /data/db"]
          # Root, but every capability dropped except the three `chown -R`
          # needs: CHOWN to change ownership, FOWNER + DAC_OVERRIDE to
          # traverse and modify dirs root does not own.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data/db
      containers:
        - name: mongodb
          # ONE-WAY DOOR: pinned to the 7.0 minor, never the floating `7`. A
          # minor jump rewrites on-disk feature-compatibility metadata and
          # mongod then refuses to start against files a newer release wrote.
          # Bump deliberately, setting featureCompatibilityVersion either side.
          image: mongo:7.0
          # uid/gid 999 is the image's `mongodb` user — the same uid the
          # initContainer above chowns to.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - "--quiet"
            - "--wiredTigerCacheSizeGB"
            - "0.25"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 384Mi
          # TCP probe, NOT `mongosh --eval`: mongosh is a heavy Node REPL whose
          # cold start alone exceeds the default 1s probe timeout, which
          # crash-loops the pod on liveness kills.
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librechat-data
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-mongodb
  namespace: platform-ai
  labels:
    app: librechat-mongodb
    app.kubernetes.io/part-of: librechat
spec:
  selector:
    app: librechat-mongodb
  ports:
    - port: 27017
      targetPort: 27017
