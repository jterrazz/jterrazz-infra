tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
  retention: 720h # 30 days
  # Keep at 0: the chart's default 1 GB ballast is a pre-Go-1.19 GC hack that
  # pins ~1 GB resident to delay collection. GOMEMLIMIT below replaces it.
  memBallastSizeMbs: 0
  extraEnv:
    - name: GOMEMLIMIT
      value: "750MiB"
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      # Tempo's ingester WAL flush spikes well above idle RSS; a tighter limit
      # OOMKills every few minutes and makes `helm --wait` flake.
      memory: 512Mi
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

persistence:
  enabled: true
  storageClassName: manual
  # Nominal — hostPath enforces no quota, the real cap is the Mac disk.
  size: 10Gi
