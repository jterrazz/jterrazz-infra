# Service-chart values for Tempo — storage only. `host` is deliberately unset
# (Grafana and the OTel collector both reach Tempo in-cluster), and with no
# host the chart emits neither IngressRoute nor Certificate.
name: tempo
storage:
  data:
    # Nominal — hostPath enforces no quota, the real cap is the Mac disk.
    size: 10Gi
    # DATA LOSS IF CHANGED — same StatefulSet constraint as loki: the
    # volumeClaimTemplate binds to storage-<release>-<ordinal> or silently
    # provisions a fresh local-path volume.
    claimName: storage-tempo-0
