# Syncs the Cloudflare Tunnel connection token from Infisical
# (/jterrazz-infrastructure, prod env) into the `cloudflared-secrets` Secret,
# which the Deployment consumes as TUNNEL_TOKEN. resyncInterval=60s so a token
# rotation propagates within a minute.
#
# Split out of deployment.yaml for consistency with every other service in
# this repo (librechat, openpanel, otel-collector): secret.yaml holds the
# InfisicalSecret, the workload file holds the workload. Real secret material
# is never committed here — only the instruction to fetch it at deploy time.
#
# Required key in Infisical /jterrazz-infrastructure:
#   CLOUDFLARE_TUNNEL_TOKEN   the connector token from Cloudflare Zero Trust →
#                             Networks → Tunnels (starts with `eyJ…`). See
#                             README.md in this directory for the one-time
#                             tunnel creation.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: cloudflared-infisical
  namespace: platform-networking
spec:
  hostAPI: https://eu.infisical.com
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: jterrazz
        envSlug: prod
        # /jterrazz-infrastructure is the platform-services path (sibling to
        # CLOUDFLARE_API_TOKEN, TAILSCALE_OAUTH_*, etc.). Apps deployed by CI
        # use /jterrazz-ci; cloudflared is platform, not an app.
        secretsPath: /jterrazz-infrastructure
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: platform-secrets
  # Name MUST be cloudflared-secrets: that's the secret referenced by
  # deployment.yaml's TUNNEL_TOKEN secretKeyRef. Renamed from
  # `cloudflared-token`, which described the payload rather than the owner —
  # every other service in the repo names its synced Secret <service>-secrets.
  managedSecretReference:
    secretName: cloudflared-secrets
    secretNamespace: platform-networking
    secretType: Opaque
