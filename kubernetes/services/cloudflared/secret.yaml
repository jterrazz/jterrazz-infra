# Syncs the Cloudflare Tunnel connection token from Infisical into the
# `cloudflared-secrets` Secret, which deployment.yaml consumes as TUNNEL_TOKEN.
# syncConfig.resyncInterval=5m, so a token rotation propagates within five
# minutes — and only into the Secret. cloudflared reads TUNNEL_TOKEN once at
# startup, so a rotation still needs `kubectl rollout restart deploy/cloudflared`
# to take effect; the resync interval was never the thing that bounded that.
#
# Required key in Infisical /jterrazz-infrastructure:
#   CLOUDFLARE_TUNNEL_TOKEN   the connector token from Cloudflare Zero Trust →
#                             Networks → Tunnels (starts with `eyJ…`). See
#                             README.md in this directory for the one-time
#                             tunnel creation.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: cloudflared-infisical
  namespace: platform-networking
spec:
  hostAPI: https://eu.infisical.com
  # syncConfig.resyncInterval (duration string), not the deprecated flat
  # `resyncInterval:` integer — see the note in
  # kubernetes/charts/app/templates/infisical.yaml.
  syncConfig:
    resyncInterval: 5m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: jterrazz
        envSlug: prod
        # Platform-services path. Apps deployed by CI use /jterrazz-ci instead.
        secretsPath: /jterrazz-infrastructure
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: platform-secrets
  # Name MUST stay cloudflared-secrets — deployment.yaml's TUNNEL_TOKEN
  # secretKeyRef reads it by that literal name.
  managedKubeSecretReferences:
    - secretName: cloudflared-secrets
      secretNamespace: platform-networking
      secretType: Opaque
