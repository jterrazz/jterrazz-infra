# kube-state-metrics — the source of every kube_* series.
#
# STANDALONE RELEASE since the VictoriaMetrics migration. It used to arrive as a
# subchart of the `prometheus` release (`kube-state-metrics.enabled: true` in
# prometheus/helm.yaml); that release is gone, and VictoriaMetrics' chart has no
# equivalent bundling, so it is installed directly from the same upstream repo at
# the same chart major the prometheus chart depended on (`kube-state-metrics 8.0.*`).
#
# Nothing here configures scraping: the chart annotates its own Service with
# prometheus.io/scrape=true, and victoria-metrics' `kubernetes-service-endpoints`
# job keeps exactly that annotation. Discovery is order-independent, so this
# release and victoria-metrics can be installed in either order.
#
# The release is named `kube-state-metrics`, which the chart's fullname helper
# collapses to `kube-state-metrics` (release name already contains the chart
# name) — no fullnameOverride needed. The Service name changes from
# `prometheus-kube-state-metrics`, which moves the `service`/`instance` labels on
# these series. Neither dashboard in this repo selects on them; both query the
# kube_* metric names directly.

# Carried over verbatim from the `kube-state-metrics:` block of the old
# prometheus/helm.yaml.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 192Mi
