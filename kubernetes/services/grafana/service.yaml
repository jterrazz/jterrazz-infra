# Service-chart values for Grafana (Cert + private IngressRoute + storage).
#
# `storage` is new here: the grafana-data PV/PVC used to be rendered by
# ansible/templates/kubernetes/telemetry-storage.yaml.j2 alongside
# loki/tempo/prometheus. Object names (grafana-data / grafana-data), size
# (1Gi) and hostPath (/var/lib/k8s-data/grafana) are unchanged — same
# migration as prometheus/loki/tempo's service.yaml.
name: grafana
host: grafana.jterrazz.com
port: 80
# Tailnet-only. Grafana's datasources reach every telemetry backend in the
# cluster; there is no reason for it to answer the public internet.
access: private
storage:
  # grafana.db — users, API keys, starred dashboards, alert state. Dashboards
  # themselves are provisioned from ConfigMaps and are not stored here.
  data:
    size: 1Gi
