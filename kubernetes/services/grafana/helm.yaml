persistence:
  enabled: true
  existingClaim: grafana-data

resources:
  requests:
    cpu: 50m
    memory: 160Mi
  limits:
    memory: 384Mi

sidecar:
  dashboards:
    enabled: true
    searchNamespace: ALL
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  # Rules fire and show in the Alerting UI, but no contact point is wired, so
  # nothing is delivered anywhere. Deliberate — delivery is a later step.
  #
  # The RULES themselves live with the app that emits the metric: the app chart
  # renders `spec.alerts` into a ConfigMap labelled grafana_alert=1, which this
  # sidecar picks up from any namespace. Nothing in THIS repo applies app alert
  # rules — one that did would outlive the app it watches.
  alerts:
    enabled: true
    searchNamespace: ALL
    label: grafana_alert
    labelValue: "1"

datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.platform-telemetry.svc:80
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.platform-telemetry.svc:3100
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.platform-telemetry.svc:3100
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus

# The IngressRoute comes from the service chart (platform.yaml) instead.
ingress:
  enabled: false
