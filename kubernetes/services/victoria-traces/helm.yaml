# VictoriaTraces single-node — the trace store, replacing Tempo.
#
# Chart: vm/victoria-traces-single (see platform_chart_versions.victoria_traces).
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ 0.x, KNOWINGLY. VictoriaTraces is the youngest member of the family and  │
# │ is still pre-1.0 (chart 0.1.x / app v0.9.x). Accepted on purpose: no     │
# │ production traffic depends on trace history here, and trace history is   │
# │ the one telemetry stream this cluster can afford to lose outright. Do    │
# │ NOT extend the same tolerance to victoria-metrics or victoria-logs,      │
# │ which are both 1.x.                                                      │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Ingest, on :10428 — OTLP/HTTP only in this setup:
#   /insert/opentelemetry/v1/traces
#   https://docs.victoriametrics.com/victoriatraces/data-ingestion/opentelemetry/
# The path is non-standard for OTLP, so the collector must set the exporter's
# `traces_endpoint` (full URL) rather than `endpoint` (which appends /v1/traces).
# The OTLP gRPC listener stays OFF: enabling it needs `-otlpGRPCListenAddr` and
# nothing here speaks gRPC to the store.
#
# Query, same port — Jaeger-compatible API at /select/jaeger, which is what the
# Grafana `jaeger` datasource in grafana/helm.yaml points at:
#   https://docs.victoriametrics.com/victoriatraces/querying/grafana/
# (v0.9.4 also serves a Tempo-compatible API at /select/tempo. Not used: the
# Jaeger surface is the documented, non-experimental one.)

server:
  # Without this the objects are named <release>-vt-single-server (the chart's
  # nameOverride is `vt-single`, not the chart name).
  fullnameOverride: victoria-traces

  # DATA LOSS IF CHANGED — see the matching note in platform.yaml. `existingClaim`
  # also makes the chart drop its StatefulSet volumeClaimTemplate and mount this
  # PVC by name, which is why no `claimName` override is needed here (tempo did
  # need one: storage-tempo-0).
  persistentVolume:
    existingClaim: victoria-traces-data

  # 720h == 30d, byte-for-byte the window `tempo.retention` held. Written in
  # hours to stay comparable with the value it replaces; the flag takes
  # s/h/d/w/M/y suffixes and the minimum supported retention is 1d.
  retentionPeriod: "720h"

  # REQUEST right-sized down from 192Mi (2026-07-26), same reasoning as
  # victoria-logs: the number was inherited from Tempo, and VictoriaTraces
  # budgets its caches from `-memory.allowedPercent` of the LIMIT rather than
  # from the request — so the request was reserving node capacity that nothing
  # ever occupied. This is also the lowest-traffic store here (trace ingest is
  # GenAI spans plus whatever apps emit).
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      # Carried over from Tempo, whose WAL flush spiked well above idle RSS.
      # VictoriaTraces should need less, but a limit that is too tight OOMKills
      # in a loop and makes `helm --wait` flake — measure before tightening.
      memory: 512Mi

  extraArgs:
    # Victoria-family equivalent of the GOMEMLIMIT this repo set on Tempo (which
    # also replaced that chart's 1 GB memory ballast). Percentage of the detected
    # cgroup memory limit, so it tracks resources.limits.memory above. 60 is the
    # upstream default; written out because it is a deliberate bound.
    memory.allowedPercent: 60

  # Same reasoning as victoria-logs/helm.yaml: uid 1000 / fsGroup 2000 with a
  # read-only root fs, and fsGroup is not applied to hostPath volumes, so a
  # freshly created /var/lib/k8s-data/victoria-traces would be root-owned and
  # unwritable. runAsUser 0 + runAsNonRoot false override the pod-level context.
  initContainers:
    - name: fix-permissions
      image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
      command: ["sh", "-c", "chown -R 1000:2000 /storage"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        # `server-volume` is the chart's fixed internal name for the data
        # volume, not something these values can rename.
        - name: server-volume
          mountPath: /storage
