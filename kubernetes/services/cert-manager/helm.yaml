# `crds.enabled` + `crds.keep`, not the older `installCRDs: true` — that key is
# deprecated upstream (it is exactly equivalent to these two) and is on its way
# out. Verified to render a byte-identical object set, all 6 CRDs included.
# `keep: true` means a `helm uninstall` leaves the CRDs (and therefore every
# Certificate/ClusterIssuer) in place rather than cascade-deleting them.
crds:
  enabled: true
  keep: true
# Aggressive leader-election timeouts: single-node, so there is no peer to
# race and a shorter lease means faster recovery after a reboot.
global:
  leaderElection:
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s
# 128Mi floor on every component: these Go processes spike well above idle RSS
# during cert reconciliation and CRD-watch reconnects, and an OOM-killed
# webhook flips 0/1 and times out `helm --wait` for the whole platform deploy.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
