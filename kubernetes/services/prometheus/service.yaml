# Service-chart values for Prometheus — storage only. `host` is deliberately
# unset (Grafana queries it in-cluster), and with no host the chart emits
# neither IngressRoute nor Certificate.
#
# The PVC name is load-bearing: prometheus/helm.yaml pins
# `server.persistentVolume.existingClaim: prometheus-data`, which is
# <name>-<key> = prometheus-data. Rename either half and Prometheus starts on
# a fresh dynamically-provisioned volume.
name: prometheus
storage:
  # Nominal — hostPath enforces no quota, the real cap is the Mac disk. 30d at
  # ~285MB/day is ~8-10GB steady state.
  data:
    size: 20Gi
