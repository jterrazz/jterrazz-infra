# Service-chart values for Prometheus — storage only, no ingress.
#
# Prometheus has no hostname: it is scraped/queried in-cluster by Grafana
# (and written to by the OTel collector's prometheusremotewrite exporter), so
# there is nothing to put behind Traefik. With `host` unset the chart emits
# neither an IngressRoute nor a Certificate.
#
# MIGRATION: this replaces the prometheus half of
# ansible/templates/kubernetes/telemetry-storage.yaml.j2. Object names, size
# and hostPath are byte-identical to what that template produced:
#   PV  prometheus-data   20Gi   /var/lib/k8s-data/prometheus
#   PVC prometheus-data   20Gi   volumeName: prometheus-data
# The claim name is load-bearing: prometheus/helm.yaml pins
# `server.persistentVolume.existingClaim: prometheus-data`.
name: prometheus
storage:
  # 20Gi is nominal — hostPath enforces no quota, the real cap is the Mac
  # disk. Sized for the 30d time-based retention set in helm.yaml
  # (~285MB/day → ~8-10GB steady state).
  data:
    size: 20Gi
