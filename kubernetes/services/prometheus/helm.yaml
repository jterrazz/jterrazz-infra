server:
  persistentVolume:
    existingClaim: prometheus-data
  resources:
    requests:
      cpu: 50m
      # Live working set is ~431Mi; the rest is scrape/query burst headroom.
      memory: 640Mi
    limits:
      memory: 896Mi
  # Age-based only — do NOT add a retentionSize cap: at ~285MB/day a size cap
  # silently clips the window (a 2GB cap gave ~7d of history). Cost of a long
  # window is disk + page cache, not heap: Prometheus keeps only the ~2h head
  # block's index in RAM.
  retention: "30d"
  # Soft limit under the 896Mi hard limit, so the Go GC releases pages to the
  # OS as RSS climbs instead of drifting into an OOM kill.
  env:
    - name: GOMEMLIMIT
      value: "680MiB"
  extraFlags:
    # Required by the OTel collector's prometheusremotewrite exporter.
    - "web.enable-remote-write-receiver"
    # Without it the configmap-reload sidecar's POST /-/reload 403s every
    # minute and config changes only apply on a full pod restart.
    - "web.enable-lifecycle"
  # hostPath dirs are created root-owned; Prometheus runs as nobody:65534.
  #
  # `extraInitContainers`, NOT `initContainers` — the latter is not a key this
  # chart has ever had (checked 28.13.0 and 29.19.0), so it rendered nothing
  # and this chown never ran. It works today only because the data dir is
  # already correctly owned; on the next repave, which recreates the hostPath
  # dir root-owned, Prometheus would have crash-looped on an unwritable /data.
  extraInitContainers:
    - name: fix-permissions
      image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
      command: ["sh", "-c", "chown -R 65534:65534 /data"]
      volumeMounts:
        - name: storage-volume
          mountPath: /data

# Grafana owns alerting (see grafana/helm.yaml sidecar.alerts).
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
