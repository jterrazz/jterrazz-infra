# Monolithic — one node, no need for the distributed read/write split. Chart
# 12.0.0 renamed this mode from `SingleBinary` to `Monolithic` (the old name is
# still accepted) and flipped the chart DEFAULT to Monolithic; the values key
# below is still `singleBinary`, which is why the two names disagree here.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # Query-lookback bound only: compactor retention-delete is off, so on-disk
    # chunks are kept indefinitely regardless (log volume is tiny).
    retention_period: 90d

singleBinary:
  replicas: 1
  # GOMEMLIMIT (soft) under the 512Mi hard limit so the Go GC releases
  # memory to the OS as RSS climbs, instead of drifting upward.
  extraEnv:
    - name: GOMEMLIMIT
      value: "400MiB"
  persistence:
    storageClass: manual
    # Nominal — hostPath enforces no quota, the real cap is the Mac disk.
    size: 20Gi
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

# Distributed-mode components, off (see deploymentMode).
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Nothing outside the cluster talks to Loki, so no gateway is needed.
gateway:
  enabled: false

# TOP-LEVEL, not under `monitoring:` — it always was, in 6.x too. Nested under
# `monitoring:` this was a silent no-op and the canary DaemonSet ran anyway
# (an extra pod per node writing synthetic log lines into Loki, on a cluster
# that is memory-bound). `lokiCanary.enabled` defaults to TRUE, so this line is
# load-bearing. `monitoring.selfMonitoring` is gone entirely — chart 9.0.0
# removed it with the Grafana Agent EOL — and the rest of the `monitoring:`
# block was rewritten in 18.0.0; nothing here scrapes Loki via ServiceMonitor,
# so the whole block is simply absent now.
lokiCanary:
  enabled: false

test:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
