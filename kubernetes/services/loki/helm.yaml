# SingleBinary — one node, no need for the distributed read/write split.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # Query-lookback bound only: compactor retention-delete is off, so on-disk
    # chunks are kept indefinitely regardless (log volume is tiny).
    retention_period: 90d

singleBinary:
  replicas: 1
  # GOMEMLIMIT (soft) under the 512Mi hard limit so the Go GC releases
  # memory to the OS as RSS climbs, instead of drifting upward.
  extraEnv:
    - name: GOMEMLIMIT
      value: "400MiB"
  persistence:
    storageClass: manual
    # Nominal — hostPath enforces no quota, the real cap is the Mac disk.
    size: 20Gi
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

# Distributed-mode components, off (see deploymentMode).
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Nothing outside the cluster talks to Loki, so no gateway is needed.
gateway:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

test:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
