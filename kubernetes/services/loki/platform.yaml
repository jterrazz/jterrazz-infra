# Service-chart values for Loki — storage only. `host` is deliberately unset
# (Grafana, the OTel collector and Alloy all reach Loki in-cluster), and with
# no host the chart emits neither IngressRoute nor Certificate.
name: loki
storage:
  data:
    # Nominal — hostPath enforces no quota, the real cap is the Mac disk.
    size: 20Gi
    # DATA LOSS IF CHANGED. The upstream chart runs SingleBinary as a
    # StatefulSet, whose volumeClaimTemplate binds to
    # storage-<release>-<ordinal> or nothing — any other name and it silently
    # provisions a fresh local-path volume, losing every log.
    claimName: storage-loki-0
