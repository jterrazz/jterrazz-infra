# Prometheus node-exporter — the source of every node_* series, i.e. the whole
# "VPS - Server Overview" dashboard.
#
# STANDALONE RELEASE since the VictoriaMetrics migration. It used to arrive as a
# subchart of the `prometheus` release (`prometheus-node-exporter.enabled: true`
# in prometheus/helm.yaml); that release is gone, so it is installed directly
# from the same upstream repo at the same chart major the prometheus chart
# depended on (`prometheus-node-exporter 4.56.*`).
#
# Nothing here configures scraping: the chart annotates its own Service with
# prometheus.io/scrape=true, and victoria-metrics' `kubernetes-service-endpoints`
# job keeps exactly that annotation. Order-independent, like kube-state-metrics.

# The chart's name is `prometheus-node-exporter`, so a release called
# `node-exporter` would otherwise render every object as
# `node-exporter-prometheus-node-exporter`.
fullnameOverride: node-exporter

# Carried over verbatim from the `prometheus-node-exporter:` block of the old
# prometheus/helm.yaml. Everything else — hostNetwork, hostPID, the host /proc
# and /sys mounts, the tolerations — stays at the chart defaults, which is
# exactly what the subchart ran with.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
