---
# Network Policies for platform-registry (the private Docker registry).
#
# The registry holds every application image and its push credentials are
# htpasswd-only, so it is the second crown jewel after Portainer. The
# Deployment/Service/IngressRoute themselves are rendered by Ansible
# (ansible/templates/kubernetes/registry.yaml.j2) into this namespace; only
# the namespace and these policies are declared here.
#
# Ingress path in scope: containerd on the node and CI runners on the tailnet
# both resolve registry.jterrazz.com and terminate at Traefik (kube-system),
# which then dials the registry Service on 5000. Nothing else legitimately
# reaches port 5000.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-registry

---
# Traefik (kube-system) -> registry:5000. Every pull and push arrives this
# way; there is no direct ClusterIP consumer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-registry
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 5000

---
# Egress: the registry uses local filesystem storage (a hostPath PVC), so in
# principle it needs nothing but DNS.
#
# TODO tighten after repave validation — 443 is allowed alongside DNS rather
# than DNS alone. A registry that cannot egress fails pushes in confusing,
# half-completed ways (see the blob-upload incident documented in
# registry.yaml.j2), and this namespace is on the critical path for every app
# deploy. Drop the 443 rule once a full CI push/pull cycle is confirmed green
# on the fresh cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-registry
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
