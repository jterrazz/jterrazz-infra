---
# Platform Namespaces
#
# Every platform namespace is declared here and created by this kustomize
# base — no imperative `kubectl create ns`, no per-service namespace manifest.
# Uniform convention: one `app.kubernetes.io/component` label naming the
# namespace's role (the suffix after `platform-`).

apiVersion: v1
kind: Namespace
metadata:
  name: platform-management
  labels:
    app.kubernetes.io/component: management

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-networking
  labels:
    app.kubernetes.io/component: networking

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-registry
  labels:
    app.kubernetes.io/component: registry

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-automation
  labels:
    app.kubernetes.io/component: automation

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-secrets
  labels:
    app.kubernetes.io/component: secrets

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-ai
  labels:
    app.kubernetes.io/component: ai

---
# Grafana / Prometheus / Loki / Tempo / OTel Collector. Was created
# imperatively by the platform playbook; declared here so the whole namespace
# set is in one place.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-telemetry
  labels:
    app.kubernetes.io/component: telemetry

---
# OpenPanel (self-hosted product analytics). Was declared in
# kubernetes/platform/openpanel/namespace.yaml, which is now deleted.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-analytics
  labels:
    app.kubernetes.io/component: analytics
