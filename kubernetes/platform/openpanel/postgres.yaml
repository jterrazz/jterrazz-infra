# PostgreSQL for OpenPanel (relational data: orgs, projects, dashboards,
# users). Upstream self-hosting pins postgres:14-alpine. Single-node,
# Recreate strategy — never two writers on one RWO hostPath volume.
#
# Data on a manual hostPath PV/PVC (Retain, under /var/lib/k8s-data -> Mac on
# OrbStack) so it survives pod restarts, redeploys and `pulumi destroy`
# repaves. Same convention as librechat's mongodb/uploads.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openpanel-postgres
spec:
  capacity:
    storage: 3Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/k8s-data/openpanel/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openpanel-postgres
  namespace: platform-analytics
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 3Gi
  volumeName: openpanel-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-postgres
  namespace: platform-analytics
  labels:
    app: op-postgres
    app.kubernetes.io/part-of: openpanel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: op-postgres
  template:
    metadata:
      labels:
        app: op-postgres
    spec:
      # hostPath dirs are created root-owned. The postgres entrypoint normally
      # chowns PGDATA itself and su-exec's down, but we pin the container to
      # uid 70 below so that branch never runs — hence this explicit chown.
      # NOTE 70:70 is correct for the ALPINE variant (the Debian-based
      # postgres images use 999 instead).
      initContainers:
        - name: fix-perms
          image: busybox:1.37@sha256:e226d6308690dbe282443c8c7e57365c96b5228f0fe7f40731b5d84d37a06839
          command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql/data"]
          # Must stay root to chown, but keeps every other guardrail: no
          # privilege escalation, seccomp on, and all capabilities dropped
          # except the three `chown -R` needs (CHOWN to change ownership,
          # FOWNER + DAC_OVERRIDE to traverse/modify dirs root does not own).
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:14-alpine
          # Runs as the alpine image's `postgres` user (uid/gid 70); the
          # initContainer above hands it a correctly-owned PGDATA.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openpanel-secrets
                  key: POSTGRES_PASSWORD
            # Keep PGDATA in a subdir so lost+found / hostPath root never
            # collides with initdb's empty-dir check.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openpanel-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: op-postgres
  namespace: platform-analytics
  labels:
    app: op-postgres
spec:
  selector:
    app: op-postgres
  ports:
    - port: 5432
      targetPort: 5432
