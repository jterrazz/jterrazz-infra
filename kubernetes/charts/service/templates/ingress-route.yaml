{{- /*
`access` picks the Traefik ipAllowList middleware for this route: exactly one,
or none. NEVER chain the two allow-lists — Traefik ANDs chained ipAllowLists,
so the source would have to satisfy BOTH and chaining allows strictly less,
not more.

A leftover boolean `private:` key fails the render rather than being ignored:
ignoring it would silently apply the `private` DEFAULT to a values file that
meant `private: false`, i.e. change network exposure by omission.
*/ -}}
{{- if hasKey .Values "private" }}
{{- fail "`private` was replaced by `access: private|cluster-internal|public` in service chart 2.1 — remove it from this values file" }}
{{- end }}
{{- $access := .Values.access | default "private" -}}
{{- $middleware := "" -}}
{{- if eq $access "private" -}}
{{- $middleware = "private-access" -}}
{{- else if eq $access "cluster-internal" -}}
{{- $middleware = "cluster-internal-access" -}}
{{- else if ne $access "public" -}}
{{- fail (printf "access must be one of private|cluster-internal|public, got %q" $access) -}}
{{- end -}}
{{- if .Values.host }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    {{/* One rule matching the canonical host plus any aliases. Aliases exist
         for renames: a service can answer on its old and new name at once, so
         a hostname migration needs no window in which consumers still holding
         the old name break. Remove the alias once every consumer has moved. */}}
    - match: Host({{ range $i, $h := (concat (list (include "service.host" .)) (.Values.aliases | default list)) }}{{ if $i }}, {{ end }}`{{ $h }}`{{ end }})
      kind: Rule
      {{- if $middleware }}
      middlewares:
        - name: {{ $middleware }}
          namespace: platform-networking
      {{- end }}
      services:
        - name: {{ include "service.name" . }}
          port: {{ .Values.port }}
  tls:
    secretName: {{ include "service.name" . }}-tls
{{- end }}
