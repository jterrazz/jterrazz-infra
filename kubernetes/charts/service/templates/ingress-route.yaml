{{- /*
`access` (chart 2.1) picks the Traefik ipAllowList middleware for this route.
It replaces the boolean `private` of chart 2.0, which could only express
"private-access or nothing" — so any route that needed the strictly-wider
`cluster-internal-access` list (registry's containerd hairpin pull,
openpanel's dashboard SSR) could not be described by this chart at all and
had to be hand-written elsewhere.

Never chain the two allow-lists: Traefik ANDs chained ipAllowLists, so the
source would have to satisfy BOTH — chaining allows strictly less, not more.
Hence exactly one middleware, or none.

Fail loudly on a leftover `private:` key. Silently ignoring it would swap a
tailnet-only route for the `private` DEFAULT on a values file that meant
`private: false`, i.e. quietly narrow or widen network exposure — the one
class of change that must never happen by omission.
*/ -}}
{{- if hasKey .Values "private" }}
{{- fail "`private` was replaced by `access: private|cluster-internal|public` in service chart 2.1 — remove it from this values file" }}
{{- end }}
{{- $access := .Values.access | default "private" -}}
{{- $middleware := "" -}}
{{- if eq $access "private" -}}
{{- $middleware = "private-access" -}}
{{- else if eq $access "cluster-internal" -}}
{{- $middleware = "cluster-internal-access" -}}
{{- else if ne $access "public" -}}
{{- fail (printf "access must be one of private|cluster-internal|public, got %q" $access) -}}
{{- end -}}
{{- if .Values.host }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ include "service.host" . }}`)
      kind: Rule
      {{- if $middleware }}
      middlewares:
        - name: {{ $middleware }}
          namespace: platform-networking
      {{- end }}
      services:
        - name: {{ include "service.name" . }}
          port: {{ .Values.port }}
  tls:
    secretName: {{ include "service.name" . }}-tls
{{- end }}
