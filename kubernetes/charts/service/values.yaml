# service chart defaults
# Each platform service overrides these in kubernetes/services/<svc>/service.yaml

name: ""
host: ""
port: 80

# Network visibility of the IngressRoute. Chooses which Traefik ipAllowList
# middleware is attached (the two are never chained — Traefik ANDs chained
# ipAllowLists, so chaining allows strictly less, not more):
#
#   private          -> private-access           tailnet humans only. The default.
#   cluster-internal -> cluster-internal-access  strict superset of private:
#                       tailnet humans PLUS the pod/service CIDRs and the
#                       node. For routes something inside the cluster must
#                       also reach (registry image pulls, openpanel SSR).
#   public           -> no access middleware. The route is still behind the
#                       rate-limit / compress / security-headers chain that
#                       the websecure entrypoint attaches globally.
#
# Replaces the boolean `private` of chart 2.0; a leftover `private` key now
# fails the render (see templates/ingress-route.yaml).
access: private

# Named volumes. MAP of <key> -> { size, pathSuffix, claimName } as of chart
# 2.0 (was a single object with size/pathSuffix at the top level).
#
# The PV is always named <name>-<key>, so the key `data` reproduces the
# historical <name>-data PV name exactly. hostPath is
# /var/lib/k8s-data/<name>[/<pathSuffix>].
#
# storage:
#   data:
#     size: 3Gi
#     # pathSuffix nests the volume under the app dir (1 dir = 1 app), e.g.
#     # pathSuffix: mongo -> hostPath /var/lib/k8s-data/<name>/mongo
#     pathSuffix: mongo
#     # claimName overrides ONLY the PVC's metadata.name (chart 2.1) — for a
#     # volume whose consumer imposes the claim name. A StatefulSet's
#     # volumeClaimTemplate binds to storage-<release>-<ordinal> and nothing
#     # else. PV name and the PVC's volumeName binding stay <name>-<key>.
#     claimName: storage-loki-0
#   uploads:
#     size: 5Gi
#     pathSuffix: uploads
storage: {}

# Infrastructure settings (injected by Ansible at deploy time).
# nodeName is the k8s node name used as the hostPath PV's nodeAffinity
# match (single-node k3s, safety belt against accidental schedule on a
# renamed node).
infrastructure:
  nodeName: ""
