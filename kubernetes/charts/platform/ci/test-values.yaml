# CI fixture for the platform chart.
#
# Purpose: make `helm template`/`helm lint` render REAL objects. Every
# template is gated (`if .Values.host`, `range .Values.storage`), so linting
# with default values renders ZERO objects. This file is the contract the CI
# kubeconform step renders against.
#
#   helm template platform kubernetes/charts/platform \
#     -f kubernetes/charts/platform/ci/test-values.yaml
#
# Exercises the two-volume storage map introduced in chart 2.0 (the librechat
# shape) plus the populated-nodeName path that the app chart's fixture
# deliberately leaves empty.

name: ci-test-platform
host: ci-test-platform.jterrazz.com
port: 8080

# Attaches the private-access middleware to the IngressRoute. Flip to false
# locally to check the public branch.
private: true

# Named volumes. Object names are <name>-<key>; hostPath is
# /var/lib/k8s-data/<name>[/<pathSuffix>].
storage:
  # No pathSuffix -> /var/lib/k8s-data/ci-test-platform
  # PV/PVC: ci-test-platform-data (reproduces the historical <name>-data name).
  data:
    size: 3Gi
  # With pathSuffix -> /var/lib/k8s-data/ci-test-platform/uploads
  # PV/PVC: ci-test-platform-uploads.
  uploads:
    size: 5Gi
    pathSuffix: uploads

# Populated so the PV nodeAffinity block renders. With this empty the block
# must be omitted entirely rather than emit `values: [""]`.
infrastructure:
  nodeName: ci-test-node
