# Platform chart defaults
# Each platform service overrides these in its platform.yaml

name: ""
host: ""
port: 80
private: true

# Named volumes. MAP of <key> -> { size, pathSuffix } as of chart 2.0
# (was a single object with size/pathSuffix at the top level).
#
# Object names are <name>-<key>, so the key `data` reproduces the historical
# <name>-data PV/PVC names exactly. hostPath is
# /var/lib/k8s-data/<name>[/<pathSuffix>].
#
# storage:
#   data:
#     size: 3Gi
#     # pathSuffix nests the volume under the app dir (1 dir = 1 app), e.g.
#     # pathSuffix: mongo -> hostPath /var/lib/k8s-data/<name>/mongo
#     pathSuffix: mongo
#   uploads:
#     size: 5Gi
#     pathSuffix: uploads
storage: {}

# Infrastructure settings (injected by Ansible at deploy time).
# nodeName is the k8s node name used as the hostPath PV's nodeAffinity
# match (single-node k3s, safety belt against accidental schedule on a
# renamed node).
infrastructure:
  nodeName: ""
