# Default values for app chart
# Apps define their config in .infrastructure/application.yaml

metadata:
  name: ""

spec:
  port: 3000
  resources:
    cpu: 100m
    memory: 256Mi
    memoryLimit: ""
  storage: {}
  configFiles: {}
  dashboards: {}
  # name -> Grafana unified-alerting provisioning YAML (the `apiVersion: 1` /
  # `groups:` document). prod-only, like dashboards. Same map shape, so the
  # inline form used today and a future CI `--set-file spec.alerts.<name>=…`
  # produce identical values.
  alerts: {}
  # Escape hatch only: merged OVER the chart's hardened container defaults
  # (see templates/deployment.yaml) by an app that genuinely needs a
  # capability back, so it never has to fork the chart.
  securityContext: {}
  # Opt-in in-cluster platform services, resolved against the catalog in
  # templates/_helpers.tpl (app.platformCatalog). Valid: otel-collector,
  # gateway-intelligence. Unknown names hard-fail the render.
  platformServices: []
  networkPolicy:
    # Namespaces of client apps allowed to reach this app's port, by bare name
    # (expanded to prod-/next-/staging-<name>). One-off, non-platform traffic
    # only — platform-service ingress and all egress come from
    # spec.platformServices.
    allowedClients: []
  health:
    path: /health
    periodSeconds: 30
    # k8s's own defaults (1s / 3) are too tight for an app that also runs
    # in-process background work.
    timeoutSeconds: 5
    failureThreshold: 5
    # startupProbe grace = startupFailureThreshold * startupPeriodSeconds
    # (60 * 5s = 5min) before liveness/readiness begin.
    startupPeriodSeconds: 5
    startupFailureThreshold: 60

environments: {}

# Set by app CI during helm upgrade --install
environment: ""

# Registry credentials (passed from CI via --set)
registry:
  server: registry.internal.jterrazz.com
  username: ""
  password: ""
