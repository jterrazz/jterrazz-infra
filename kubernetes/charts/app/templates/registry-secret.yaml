{{- if eq (include "app.envExists" .) "true" -}}
{{- if and .Values.registry .Values.registry.username .Values.registry.password -}}
{{- /*
Build the dockerconfigjson through the templating engine (dict -> toJson)
rather than by interpolating the credentials into a hand-written JSON string.

The previous version pasted the password straight between two quote
characters, so any password containing a `"` or a `\` produced invalid JSON.
The Secret still applied cleanly (it is opaque bytes to the apiserver), but
every image pull then failed with an unhelpful auth error. toJson escapes
both correctly.

`auth` (base64 of user:password) is included because containerd reads that
field in preference to the username/password pair.
*/ -}}
{{- $server := .Values.registry.server -}}
{{- $user := .Values.registry.username -}}
{{- $pass := .Values.registry.password -}}
{{- $entry := dict "username" $user "password" $pass "auth" (printf "%s:%s" $user $pass | b64enc) -}}
{{- $dockerconfig := dict "auths" (dict $server $entry) -}}
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerconfig | toJson | b64enc }}
{{- end }}
{{- end }}
