{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- if $spec.storage -}}
{{- $appName := include "app.name" . -}}
{{- /*
Both fields are load-bearing, hence `required`: size sizes the PV *and* the
PVC request (they must match for a manual bind), and mountPath is consumed by
deployment.yaml. An empty value produces a PV that never binds or a container
with an empty mountPath — both only diagnosable at runtime.
*/ -}}
{{- $size := $spec.storage.size | required (printf "spec.storage.size is required when spec.storage is set (app %s)" $appName) -}}
{{- $_ := $spec.storage.mountPath | required (printf "spec.storage.mountPath is required when spec.storage is set (app %s)" $appName) -}}
{{- /*
NO nodeAffinity here: only app CI installs this chart and it passes no node
name. If a second node is ever added, restore it here AND in
kubernetes/charts/service/templates/storage.yaml together — an unpinned
hostPath PV can bind on a node whose disk holds an empty directory.
*/ -}}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $appName }}-{{ .Values.environment }}-data
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ $size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/k8s-data/{{ $appName }}-{{ .Values.environment }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $appName }}-data
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $size }}
  storageClassName: manual
  volumeName: {{ $appName }}-{{ .Values.environment }}-data
{{- end }}
{{- end }}
