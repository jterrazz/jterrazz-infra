{{- if eq (include "app.envExists" .) "true" -}}
{{- if .Values.spec.storage -}}
{{- $appName := include "app.name" . -}}
{{- /*
Fail loudly on a half-configured storage block. Both fields are load-bearing:
size sizes the PV *and* the PVC request (they must match for a manual bind),
and mountPath is consumed by deployment.yaml. Without `required` a missing
value rendered as an empty string and produced either a PV that never bound
or a container with an empty mountPath — both only diagnosable at runtime.
*/ -}}
{{- $size := .Values.spec.storage.size | required (printf "spec.storage.size is required when spec.storage is set (app %s)" $appName) -}}
{{- $_ := .Values.spec.storage.mountPath | required (printf "spec.storage.mountPath is required when spec.storage is set (app %s)" $appName) -}}
{{- /*
nodeAffinity pins the hostPath PV to the node whose local disk actually holds
the data — a safety belt against a renamed or added node silently scheduling
the pod somewhere with an empty directory. Same value pattern as the platform
chart (infrastructure.nodeName, injected by Ansible at deploy time).

Emitted ONLY when a node name is supplied: app-repo CI installs this chart
without it, and an empty `values: [""]` match expression would produce a PV
that can never bind anywhere.
*/ -}}
{{- $nodeName := .Values.infrastructure.nodeName | default "" -}}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $appName }}-{{ .Values.environment }}-data
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ $size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/k8s-data/{{ $appName }}-{{ .Values.environment }}
    type: DirectoryOrCreate
  {{- if $nodeName }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ $nodeName }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $appName }}-data
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $size }}
  storageClassName: manual
  volumeName: {{ $appName }}-{{ .Values.environment }}-data
{{- end }}
{{- end }}
