{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- if $spec.storage -}}
{{- $appName := include "app.name" . -}}
{{- /*
Fail loudly on a half-configured storage block. Both fields are load-bearing:
size sizes the PV *and* the PVC request (they must match for a manual bind),
and mountPath is consumed by deployment.yaml. Without `required` a missing
value rendered as an empty string and produced either a PV that never bound
or a container with an empty mountPath — both only diagnosable at runtime.
*/ -}}
{{- $size := $spec.storage.size | required (printf "spec.storage.size is required when spec.storage is set (app %s)" $appName) -}}
{{- $_ := $spec.storage.mountPath | required (printf "spec.storage.mountPath is required when spec.storage is set (app %s)" $appName) -}}
{{- /*
NO nodeAffinity here, deliberately (removed in 2.3 along with the
`infrastructure.nodeName` value). This chart is installed exclusively by app
CI (jterrazz-actions/actions/docker-deploy), which never passed a node name —
Ansible only ever installed the OTHER chart, so the branch was dead in every
real render and produced nothing but an unread value. The service chart, whose
PVs Ansible does create, still pins nodeAffinity.

If a second node is ever added, restore it there and here together: an
unpinned hostPath PV can bind on a node whose disk holds an empty directory.
*/ -}}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $appName }}-{{ .Values.environment }}-data
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ $size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/k8s-data/{{ $appName }}-{{ .Values.environment }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $appName }}-data
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $size }}
  storageClassName: manual
  volumeName: {{ $appName }}-{{ .Values.environment }}-data
{{- end }}
{{- end }}
