{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- $secrets := $spec.secrets | default dict -}}
{{- $envVars := $spec.env | default dict -}}
{{- $health := $spec.health | default dict -}}
{{- $resources := $spec.resources | default dict -}}
{{- $platformEnv := fromYaml (include "app.platformEnv" .) -}}
{{- $platformClientLabels := fromYaml (include "app.platformClientLabels" .) -}}
{{- /*
readOnlyRootFilesystem is deliberately NOT among these defaults: every app
here is a Next.js or Node service that writes caches at runtime, and setting
it would crash-loop them. `spec.securityContext` merges OVER the defaults, so
an app needing a capability back never has to fork the chart. deepCopy because
mergeOverwrite mutates its first argument.
*/ -}}
{{- $secDefaults := dict
      "allowPrivilegeEscalation" false
      "capabilities" (dict "drop" (list "ALL"))
      "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- /* runAsNonRoot would contradict an explicit spec.runAsRoot opt-out. */ -}}
{{- if not $spec.runAsRoot -}}
{{- $_ := set $secDefaults "runAsNonRoot" true -}}
{{- end -}}
{{- $securityContext := mergeOverwrite (deepCopy $secDefaults) ($spec.securityContext | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ $spec.replicas | default 1 }}
  revisionHistoryLimit: 3
  {{- if $spec.storage }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollout/release-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        {{- /* Platform-client labels: stamped on pod template labels ONLY
               (never selectorLabels — those are immutable). The target
               platform service's ingress NetworkPolicy selects on these. */}}
        {{- range $key, $value := $platformClientLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- if not $spec.runAsRoot }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- end }}
      imagePullSecrets:
        - name: registry-credentials
      {{- if $spec.storage }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.37@sha256:e226d6308690dbe282443c8c7e57365c96b5228f0fe7f40731b5d84d37a06839
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          # Must stay root: hostPath dirs are created root-owned and only root
          # can chown them to the app's uid. Every capability is still dropped
          # except the three `chown -R` needs — CHOWN to change ownership,
          # FOWNER + DAC_OVERRIDE to traverse and modify dirs root does not own.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" . }}
          imagePullPolicy: Always
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
          ports:
            - containerPort: {{ $spec.port }}
          env:
            - name: PORT
              value: {{ $spec.port | quote }}
            {{- range $key, $value := $envVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if not (hasKey $envVars "OTEL_SERVICE_NAME") }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "app.name" . }}
            {{- end }}
            {{- if not (hasKey $envVars "OTEL_RESOURCE_ATTRIBUTES") }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.environment }}"
            {{- end }}
            {{- /* Opt-in platform-service env (spec.platformServices → the
                   catalog in _helpers.tpl). An app must declare
                   `otel-collector` for telemetry to flow — declaring it is
                   also what opens the egress hole. A user-set env wins. */}}
            {{- range $key, $value := $platformEnv }}
            {{- if not (hasKey $envVars $key) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- /* Default Node.js heap cap ≈ 75% of the memory request.
                   Skipped entirely if the app sets its own NODE_OPTIONS.
                   Harmless on non-Node runtimes (the var is ignored). */}}
            {{- $nodeHeap := include "app.nodeMaxOldSpace" . }}
            {{- if and $nodeHeap (not (hasKey $envVars "NODE_OPTIONS")) }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ $nodeHeap }}"
            {{- end }}
            {{- if $secrets.env }}
            {{- range $secrets.env }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.secretsName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          {{- if or $spec.storage $spec.configFiles }}
          volumeMounts:
            {{- if $spec.storage }}
            - name: data
              mountPath: {{ $spec.storage.mountPath }}
            {{- end }}
            {{- range $filename, $content := $spec.configFiles }}
            - name: config
              mountPath: /app/{{ $filename }}
              subPath: {{ $filename }}
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $resources.cpu | default "100m" }}
              memory: {{ $resources.memory | default "256Mi" }}
            limits:
              memory: {{ include "app.memoryLimit" . }}
          # Gates liveness/readiness until the app first answers, so a slow or
          # event-loop-busy boot cannot trip liveness and SIGKILL the pod
          # mid-startup. timeoutSeconds defaults to 5s, not k8s's 1s: an app
          # running in-process background work exceeds 1s on a trivial route.
          startupProbe:
            httpGet:
              path: {{ $health.path }}
              port: {{ $spec.port }}
            periodSeconds: {{ $health.startupPeriodSeconds | default 5 }}
            timeoutSeconds: {{ $health.timeoutSeconds | default 5 }}
            failureThreshold: {{ $health.startupFailureThreshold | default 60 }}
          livenessProbe:
            httpGet:
              path: {{ $health.path }}
              port: {{ $spec.port }}
            periodSeconds: {{ $health.periodSeconds | default 30 }}
            timeoutSeconds: {{ $health.timeoutSeconds | default 5 }}
            failureThreshold: {{ $health.failureThreshold | default 5 }}
          readinessProbe:
            httpGet:
              path: {{ $health.path }}
              port: {{ $spec.port }}
            periodSeconds: 10
            timeoutSeconds: {{ $health.timeoutSeconds | default 5 }}
            failureThreshold: 3
      {{- if or $spec.storage $spec.configFiles }}
      volumes:
        {{- if $spec.storage }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "app.name" . }}-data
        {{- end }}
        {{- if $spec.configFiles }}
        - name: config
          configMap:
            name: {{ include "app.name" . }}-config
        {{- end }}
      {{- end }}
{{- end }}
