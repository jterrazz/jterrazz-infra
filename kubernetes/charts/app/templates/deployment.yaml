{{- if eq (include "app.envExists" .) "true" -}}
{{- $spec := fromYaml (include "app.merged" .) -}}
{{- $secrets := $spec.secrets | default dict -}}
{{- $envVars := $spec.env | default dict -}}
{{- $health := $spec.health | default dict -}}
{{- $resources := $spec.resources | default dict -}}
{{- $platformEnv := fromYaml (include "app.platformEnv" .) -}}
{{- $platformClientLabels := fromYaml (include "app.platformClientLabels" .) -}}
{{- /*
Container-level securityContext (pod-level runAsUser/runAsGroup/fsGroup 1000
are set further down). Shape copied from cloudflared's deployment, which is
the gold standard in this repo.

readOnlyRootFilesystem is deliberately NOT set: every app here is a Next.js
or Node service that writes caches (.next/cache, /tmp) at runtime, and
flipping it would crash-loop them.

Escape hatch: `spec.securityContext` is merged OVER these defaults, so an app
that genuinely needs a capability back can ask for it without forking the
chart. Note mergeOverwrite mutates its first argument, hence deepCopy.
*/ -}}
{{- $secDefaults := dict
      "allowPrivilegeEscalation" false
      "capabilities" (dict "drop" (list "ALL"))
      "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- /* runAsNonRoot would contradict an explicit spec.runAsRoot opt-out. */ -}}
{{- if not $spec.runAsRoot -}}
{{- $_ := set $secDefaults "runAsNonRoot" true -}}
{{- end -}}
{{- $securityContext := mergeOverwrite (deepCopy $secDefaults) ($spec.securityContext | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ $spec.replicas | default 1 }}
  revisionHistoryLimit: 3
  {{- if $spec.storage }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollout/release-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        {{- /* Platform-client labels: stamped on pod template labels ONLY
               (never selectorLabels — those are immutable). The target
               platform service's ingress NetworkPolicy selects on these. */}}
        {{- range $key, $value := $platformClientLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- if not $spec.runAsRoot }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- end }}
      imagePullSecrets:
        - name: registry-credentials
      {{- if $spec.storage }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.37@sha256:e226d6308690dbe282443c8c7e57365c96b5228f0fe7f40731b5d84d37a06839
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          # Must stay root: hostPath directories are created root-owned and
          # only root can chown them to the app's uid. It still gets the rest
          # of the hardening — no privilege escalation, seccomp on, and every
          # capability dropped except the three `chown -R` actually needs:
          # CHOWN to change ownership, FOWNER + DAC_OVERRIDE to traverse and
          # modify directories root does not own (root bypasses file
          # permission checks only by virtue of DAC_OVERRIDE).
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" . }}
          imagePullPolicy: Always
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
          ports:
            - containerPort: {{ $spec.port }}
          env:
            # Auto-injected PORT
            - name: PORT
              value: {{ $spec.port | quote }}
            {{- /* User-defined environment variables (merged base + env override) */}}
            {{- range $key, $value := $envVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- /* Auto-injected OTEL identity from metadata */}}
            {{- if not (hasKey $envVars "OTEL_SERVICE_NAME") }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "app.name" . }}
            {{- end }}
            {{- if not (hasKey $envVars "OTEL_RESOURCE_ATTRIBUTES") }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.environment }}"
            {{- end }}
            {{- /* Opt-in platform-service env (spec.platformServices → catalog
                   in _helpers.tpl). This is where OTEL_EXPORTER_OTLP_ENDPOINT
                   and GATEWAY_INTELLIGENCE_BASE_URL now come from — NO longer an
                   unconditional default: an app must declare `otel-collector`
                   (and the egress hole it opens) for telemetry to actually flow.
                   A user-set env of the same name always wins. */}}
            {{- range $key, $value := $platformEnv }}
            {{- if not (hasKey $envVars $key) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- /* Default Node.js heap cap ≈ 75% of the memory request.
                   Skipped entirely if the app sets its own NODE_OPTIONS.
                   Harmless on non-Node runtimes (the var is ignored). */}}
            {{- $nodeHeap := include "app.nodeMaxOldSpace" . }}
            {{- if and $nodeHeap (not (hasKey $envVars "NODE_OPTIONS")) }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ $nodeHeap }}"
            {{- end }}
            {{- /* Secret environment variables from Infisical */}}
            {{- if $secrets.env }}
            {{- range $secrets.env }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.secretsName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          {{- if or $spec.storage $spec.configFiles }}
          volumeMounts:
            {{- if $spec.storage }}
            - name: data
              mountPath: {{ $spec.storage.mountPath }}
            {{- end }}
            {{- range $filename, $content := $spec.configFiles }}
            - name: config
              mountPath: /app/{{ $filename }}
              subPath: {{ $filename }}
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $resources.cpu | default "100m" }}
              memory: {{ $resources.memory | default "256Mi" }}
            limits:
              memory: {{ include "app.memoryLimit" . }}
          # A startupProbe gates liveness/readiness until the app first
          # answers, so a slow or event-loop-busy boot can't trip liveness
          # and SIGKILL the pod mid-startup (startupFailureThreshold *
          # startupPeriodSeconds = grace window). timeoutSeconds defaults to
          # 5s, not k8s's brutal 1s: an app that also runs in-process
          # background work can briefly exceed 1s on a trivial health route.
          startupProbe:
            httpGet:
              path: {{ $health.path }}
              port: {{ $spec.port }}
            periodSeconds: {{ $health.startupPeriodSeconds | default 5 }}
            timeoutSeconds: {{ $health.timeoutSeconds | default 5 }}
            failureThreshold: {{ $health.startupFailureThreshold | default 60 }}
          livenessProbe:
            httpGet:
              path: {{ $health.path }}
              port: {{ $spec.port }}
            periodSeconds: {{ $health.periodSeconds | default 30 }}
            timeoutSeconds: {{ $health.timeoutSeconds | default 5 }}
            failureThreshold: {{ $health.failureThreshold | default 5 }}
          readinessProbe:
            httpGet:
              path: {{ $health.path }}
              port: {{ $spec.port }}
            periodSeconds: 10
            timeoutSeconds: {{ $health.timeoutSeconds | default 5 }}
            failureThreshold: 3
      {{- if or $spec.storage $spec.configFiles }}
      volumes:
        {{- if $spec.storage }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "app.name" . }}-data
        {{- end }}
        {{- if $spec.configFiles }}
        - name: config
          configMap:
            name: {{ include "app.name" . }}-config
        {{- end }}
      {{- end }}
{{- end }}
