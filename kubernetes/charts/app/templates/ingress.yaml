{{- if eq (include "app.envExists" .) "true" -}}
{{- $appName := include "app.name" . -}}
{{- $ingressList := fromYamlArray (include "app.ingressList" .) -}}

{{- /* One Certificate per unique host — multiple ingress entries on the
       same host share one TLS secret. */ -}}
{{- $hosts := dict -}}
{{- range $entry := $ingressList -}}
  {{- if $entry.host -}}
    {{- $_ := set $hosts $entry.host true -}}
  {{- end -}}
{{- end -}}

{{- range $host, $_ := $hosts }}
{{- $hostSlug := include "app.hostSlug" $host }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $appName }}-{{ $hostSlug }}-tls
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  secretName: {{ $appName }}-{{ $hostSlug }}-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - {{ $host }}
{{- end }}

{{- /* Resource name is {app}-{idx} so two entries sharing a host or path
       still get unique object names. */ -}}
{{- range $idx, $entry := $ingressList }}
{{- if not (hasKey $entry "public") }}
  {{- fail (printf "ingress entry %d for %s is missing the required `public: true|false` field — declare network visibility explicitly" $idx $appName) }}
{{- end }}
{{- $hostSlug := include "app.hostSlug" $entry.host }}
{{- $isPublic := $entry.public }}
{{- $path := $entry.path | default "/" }}
{{- $hasPath := ne $path "/" }}
{{- /* Defaults TRUE: backends mount routes at /<resource>, without the /api
       prefix. An app serving the literal path (e.g. an MCP server at /mcp)
       sets stripPrefix: false. */ -}}
{{- $stripPrefix := true }}
{{- if hasKey $entry "stripPrefix" }}{{- $stripPrefix = $entry.stripPrefix }}{{- end }}
{{- $emitStripPrefix := and $hasPath $stripPrefix }}
{{- $routeName := printf "%s-%d" $appName $idx }}
{{- /* A redirect entry answers on its host and sends the client elsewhere; it
       never reaches the app. `preservePath` defaults TRUE because the common
       case is a canonical-host redirect, and dropping the path there breaks
       every deep link and inbound URL that ever pointed at the old host —
       silently, with a 301 that looks correct. Set it false for a redirect to
       one fixed page. */ -}}
{{- $redirectTo := $entry.redirectTo | default "" }}
{{- $isRedirect := ne $redirectTo "" }}
{{- $preservePath := true }}
{{- if hasKey $entry "preservePath" }}{{- $preservePath = $entry.preservePath }}{{- end }}
{{- if and $isRedirect $hasPath }}
  {{- fail (printf "ingress entry %d for %s sets both `path` and `redirectTo`; a redirect answers for the whole host, so combining them silently ignores the path" $idx $appName) }}
{{- end }}
{{- if and $isRedirect (not (hasPrefix "https://" $redirectTo)) }}
  {{- fail (printf "ingress entry %d for %s: redirectTo must be an absolute https:// URL, got %q" $idx $appName $redirectTo) }}
{{- end }}
{{- if and $emitStripPrefix (not $isRedirect) }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $routeName }}-strip-prefix
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ $path }}
{{- end }}
{{- if $isRedirect }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $routeName }}-redirect
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  redirectRegex:
    # Anchored on the scheme too: Traefik matches against the full URL, so an
    # unanchored pattern would also rewrite a request whose PATH happens to
    # contain the host.
    regex: ^https?://{{ $entry.host | replace "." "\\." }}/(.*)
    replacement: {{ if $preservePath }}{{ $redirectTo }}/${1}{{ else }}{{ $redirectTo }}{{ end }}
    # 301, not 302: this host is not coming back, and a permanent redirect is
    # what moves search rankings to the canonical host.
    permanent: true
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $routeName }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ $entry.host }}`){{ if $hasPath }} && PathPrefix(`{{ $path }}`){{ end }}
      kind: Rule
      {{- if or (not $isPublic) $emitStripPrefix $isRedirect }}
      middlewares:
        {{- if not $isPublic }}
        - name: private-access
          namespace: platform-networking
        {{- end }}
        {{- if $isRedirect }}
        - name: {{ $routeName }}-redirect
        {{- end }}
        {{- if and $emitStripPrefix (not $isRedirect) }}
        - name: {{ $routeName }}-strip-prefix
        {{- end }}
      {{- end }}
      {{- /* A redirect still needs a service: Traefik requires one on every
             route, and the middleware answers before it is ever dialled. */}}
      services:
        - name: {{ $appName }}
          port: 80
  tls:
    secretName: {{ $appName }}-{{ $hostSlug }}-tls
{{- end }}
{{- end }}
